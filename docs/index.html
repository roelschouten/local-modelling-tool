/* ── Business domain board ────────────────────────────────
   The domain map is the one view whose shape is not in the model file. It is a
   grid: columns are the operating models the business is run as, lanes are the
   rows across them, and a lane is cut into cells that each cover one or more
   columns — so a lane that means the same thing everywhere can be stretched the
   whole way across while the lane above it is split per operating model. Each
   cell holds slots, and a slot points at one of the model's domains.

   A board is seeded from the `division` field the first time a model is opened
   and from then on lives per model in this browser's localStorage, beside the
   custom views, and never leaves it. */
const BOARD_LS_KEY='dbx-model-domainboard';
const BOARD_LANE_CAP=16, BOARD_COL_CAP=8;   // guards on the localStorage budget

function readAllBoards(){
  try{
    const raw=localStorage.getItem(BOARD_LS_KEY);
    if(!raw) return {};
    const o=JSON.parse(raw);
    return (o&&typeof o==='object'&&!Array.isArray(o))?o:{};
  }catch(_){ return {}; }
}
function writeAllBoards(all){
  try{ localStorage.setItem(BOARD_LS_KEY,JSON.stringify(all)); }catch(_){}
}
function newBoardId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* Every lane covers every column exactly once: the spans of its cells always
   sum to the column count. Rather than trusting that of stored data, or of the
   arithmetic in an edit, it is imposed here — a lane that comes up short grows
   empty cells on the right, and one that overruns has its tail folded into the
   last cell that still fits, so no tile is ever dropped on the floor. */
function fitCells(cells,ncols){
  const src=(cells||[]).filter(Boolean);
  const out=[];
  let used=0;
  src.forEach(cell=>{
    const slots=(cell.slots||[]);
    if(used>=ncols){
      if(out.length) out[out.length-1].slots=out[out.length-1].slots.concat(slots);
      return;
    }
    const span=Math.max(1,Math.min(parseInt(cell.span,10)||1,ncols-used));
    out.push({id:cell.id||newBoardId('c'),span,slots:slots.slice()});
    used+=span;
  });
  while(used<ncols){ out.push({id:newBoardId('c'),span:1,slots:[]}); used++; }
  return out.length?out:[{id:newBoardId('c'),span:ncols,slots:[]}];
}

/* The board a model starts with: one operating model, and one lane per
   division, in the order the divisions first appear. A model that names no
   division anywhere gets a single lane holding everything, which is still a
   workable thing to cut up by hand. */
function seedLanes(graphData,ncols){
  const lanes=[], byDivision={};
  Object.entries((graphData&&graphData.domainHierarchy)||{}).forEach(([dname,ddata])=>{
    const division=String(ddata.division||'').trim()||'Domains';
    if(!byDivision[division]){
      byDivision[division]={id:newBoardId('l'),name:division,
                            cells:[{id:newBoardId('c'),span:ncols,slots:[]}]};
      lanes.push(byDivision[division]);
    }
    byDivision[division].cells[0].slots.push({id:newBoardId('s'),domain:dname});
  });
  return lanes;
}
function seedBoard(graphData){
  return {columns:[{id:newBoardId('k'),name:'Operating model 1'}],lanes:seedLanes(graphData,1)};
}

/* A saved board outlives the model it was drawn against — a later version can
   rename or drop a domain — so every slot is checked against the model on the
   way in. A slot pointing at a domain that is gone becomes an empty slot rather
   than a tile with no name behind it. */
function normaliseBoard(board,graphData){
  const known=new Set(Object.keys((graphData&&graphData.domainHierarchy)||{}));
  const cleanSlots=list=>((list)||[]).map(slot=>({
    id:(slot&&slot.id)||newBoardId('s'),
    domain:(slot&&known.has(slot.domain))?slot.domain:null
  }));
  let columns=(((board&&board.columns)||[]).slice(0,BOARD_COL_CAP)).map((col,i)=>({
    id:(col&&col.id)||newBoardId('k'),
    name:typeof (col&&col.name)==='string'?col.name:('Operating model '+(i+1))
  }));
  if(!columns.length) columns=[{id:newBoardId('k'),name:'Operating model 1'}];
  const lanes=(((board&&board.lanes)||[]).slice(0,BOARD_LANE_CAP)).map(lane=>{
    /* Boards saved before the map had columns kept their slots on the lane
       itself; those become one cell stretched across every column. */
    const cells=(Array.isArray(lane&&lane.cells)&&lane.cells.length)
      ? lane.cells.map(cell=>({id:(cell&&cell.id)||newBoardId('c'),
                               span:Math.max(1,parseInt(cell&&cell.span,10)||1),
                               slots:cleanSlots(cell&&cell.slots)}))
      : [{id:newBoardId('c'),span:columns.length,slots:cleanSlots(lane&&lane.slots)}];
    return {id:(lane&&lane.id)||newBoardId('l'),
            name:typeof (lane&&lane.name)==='string'?lane.name:'',
            cells:fitCells(cells,columns.length)};
  });
  return {columns,
          lanes:lanes.length?lanes:seedLanes(graphData,columns.length)};
}

function boardPlaced(board){
  const placed=new Set();
  (((board&&board.lanes)||[])).forEach(lane=>
    ((lane.cells)||[]).forEach(cell=>
      ((cell.slots)||[]).forEach(slot=>{ if(slot.domain) placed.add(slot.domain); })));
  return placed;
}

/* The column indexes a lane's cells start at, so a cell can name the operating
   models it covers and the column reorder can tell whether a lane has a
   boundary where the swap needs one. */
function cellStarts(lane){
  const starts=[]; let at=0;
  (lane.cells||[]).forEach(cell=>{ starts.push(at); at+=cell.span; });
  return starts;
}

const BMAP_HINT={fontSize:11,color:'var(--faint)',lineHeight:1.5};

/* ── Business domain view ─────────────────────────────────
   The model arranged the way the business talks about it rather than the way
   the graph lays it out. Every tile is a slot with a domain assigned to it, and
   opening a tile lists that domain's entities in place, so the map itself stays
   on screen while it is read; picking an entity fills the details panel exactly
   as a click in the tree does. */
function DomainBoardView({graphData,board,onBoard,onEntityClick,selectedEntityId,openDomain,onOpenDomain}){
  const [editing,setEditing]=useState(false);
  const [dropHint,setDropHint]=useState(null);
  const dragRef=useRef(null);

  const columns=board.columns||[], lanes=board.lanes||[], ncols=columns.length;
  const domainNames=useMemo(()=>Object.keys(graphData.domainHierarchy||{}).sort(),[graphData]);
  const placed=useMemo(()=>boardPlaced(board),[board]);
  const unplaced=useMemo(()=>domainNames.filter(d=>!placed.has(d)),[domainNames,placed]);
  const gridCols=`repeat(${Math.max(1,ncols)},minmax(0,1fr))`;

  const commit=onBoard;
  const setLanes=useCallback(next=>commit({columns,lanes:next}),[commit,columns]);
  const editLane=useCallback((laneId,fn)=>
    setLanes(lanes.map(lane=>lane.id===laneId?fn(lane):lane)),[lanes,setLanes]);
  const editCell=useCallback((laneId,cellId,fn)=>
    editLane(laneId,lane=>({...lane,cells:lane.cells.map(c=>c.id===cellId?fn(c):c)})),[editLane]);

  // ── Operating models (columns) ─────────────────────────
  const addColumn=useCallback(()=>{
    if(ncols>=BOARD_COL_CAP) return;
    const next=[...columns,{id:newBoardId('k'),name:'Operating model '+(ncols+1)}];
    commit({columns:next,lanes:lanes.map(lane=>
      // a lane already stretched the whole way across stays stretched
      lane.cells.length===1
        ? {...lane,cells:[{...lane.cells[0],span:next.length}]}
        : {...lane,cells:[...lane.cells,{id:newBoardId('c'),span:1,slots:[]}]})});
  },[columns,lanes,ncols,commit]);

  const renameColumn=useCallback((colId,name)=>
    commit({columns:columns.map(c=>c.id===colId?{...c,name}:c),lanes}),[columns,lanes,commit]);

  /* Losing an operating model must not lose the tiles standing in it: a cell
     that only covered this column hands its tiles to whichever neighbour
     survives, and a cell that covered more simply gets narrower. */
  const removeColumn=useCallback(index=>{
    if(ncols<=1) return;
    const doomed=columns[index];
    const tiles=lanes.reduce((n,lane)=>{
      const starts=cellStarts(lane);
      return n+lane.cells.reduce((m,cell,ci)=>
        (index>=starts[ci]&&index<starts[ci]+cell.span&&cell.span===1)
          ? m+cell.slots.filter(s=>s.domain).length : m,0);
    },0);
    if(tiles&&!window.confirm('Remove “'+(doomed.name||'this operating model')+'”? Its '+tiles+
        ' tile'+(tiles===1?'':'s')+' move into the neighbouring column.')) return;
    const nextCols=columns.filter((_,i)=>i!==index);
    const nextLanes=lanes.map(lane=>{
      const starts=cellStarts(lane);
      let orphans=[]; const cells=[];
      lane.cells.forEach((cell,ci)=>{
        const covers=index>=starts[ci]&&index<starts[ci]+cell.span;
        if(!covers){ cells.push({...cell,slots:orphans.concat(cell.slots)}); orphans=[]; return; }
        if(cell.span>1){ cells.push({...cell,span:cell.span-1,slots:orphans.concat(cell.slots)}); orphans=[]; return; }
        orphans=orphans.concat(cell.slots);
      });
      if(orphans.length){
        if(cells.length) cells[cells.length-1]={...cells[cells.length-1],
                                                slots:cells[cells.length-1].slots.concat(orphans)};
        else cells.push({id:newBoardId('c'),span:1,slots:orphans});
      }
      return {...lane,cells:fitCells(cells,nextCols.length)};
    });
    commit({columns:nextCols,lanes:nextLanes});
  },[columns,lanes,ncols,commit]);

  /* Swapping two operating models only means anything when every lane has a
     cell boundary on both sides of the pair; a lane stretched across the two
     has nothing to swap, and shuffling the headers under it would silently
     relabel its tiles. The arrows stay disabled instead. */
  const canSwap=useCallback((i,j)=>lanes.every(lane=>{
    const starts=cellStarts(lane);
    const one=at=>lane.cells.some((cell,ci)=>starts[ci]===at&&cell.span===1);
    return one(i)&&one(j);
  }),[lanes]);

  const moveColumn=useCallback((index,dir)=>{
    const j=index+dir;
    if(j<0||j>=ncols||!canSwap(Math.min(index,j),Math.max(index,j))) return;
    const nextCols=columns.slice();
    nextCols.splice(j,0,nextCols.splice(index,1)[0]);
    const nextLanes=lanes.map(lane=>{
      const starts=cellStarts(lane);
      const a=starts.indexOf(index), b=starts.indexOf(j);
      if(a<0||b<0) return lane;
      const cells=lane.cells.slice();
      cells.splice(b,0,cells.splice(a,1)[0]);
      return {...lane,cells};
    });
    commit({columns:nextCols,lanes:nextLanes});
  },[columns,lanes,ncols,canSwap,commit]);

  // ── Lanes ──────────────────────────────────────────────
  const addLane=useCallback(()=>{
    if(lanes.length>=BOARD_LANE_CAP) return;
    setLanes([...lanes,{id:newBoardId('l'),name:'New lane',
                        cells:fitCells([{id:newBoardId('c'),span:ncols,slots:[]}],ncols)}]);
  },[lanes,ncols,setLanes]);

  const removeLane=useCallback(lane=>{
    const filled=lane.cells.reduce((n,c)=>n+c.slots.filter(s=>s.domain).length,0);
    if(filled&&!window.confirm('Remove the lane “'+(lane.name||'untitled')+'”? Its '+filled+
        ' domain'+(filled===1?'':'s')+' go back to the unplaced list.')) return;
    setLanes(lanes.filter(l=>l.id!==lane.id));
  },[lanes,setLanes]);

  const moveLane=useCallback((laneId,dir)=>{
    const i=lanes.findIndex(l=>l.id===laneId), j=i+dir;
    if(i<0||j<0||j>=lanes.length) return;
    const next=lanes.slice();
    next.splice(j,0,next.splice(i,1)[0]);
    setLanes(next);
  },[lanes,setLanes]);

  /* Stretching a lane is a merge of all its cells into one; unstretching cuts
     it back to one cell per operating model, with the tiles left in the first
     rather than guessed at. */
  const stretchLane=useCallback(laneId=>editLane(laneId,lane=>({...lane,
    cells:[{id:lane.cells[0].id,span:ncols,
            slots:lane.cells.reduce((all,c)=>all.concat(c.slots),[])}]})),[editLane,ncols]);
  const unstretchLane=useCallback(laneId=>editLane(laneId,lane=>({...lane,
    cells:fitCells([{id:lane.cells[0].id,span:1,
                     slots:lane.cells.reduce((all,c)=>all.concat(c.slots),[])}],ncols)})),[editLane,ncols]);

  const mergeRight=useCallback((laneId,cellIndex)=>editLane(laneId,lane=>{
    if(cellIndex>=lane.cells.length-1) return lane;
    const cells=lane.cells.slice();
    const a=cells[cellIndex], b=cells[cellIndex+1];
    cells.splice(cellIndex,2,{id:a.id,span:a.span+b.span,slots:a.slots.concat(b.slots)});
    return {...lane,cells};
  }),[editLane]);

  const splitCell=useCallback((laneId,cellIndex)=>editLane(laneId,lane=>{
    const cell=lane.cells[cellIndex];
    if(!cell||cell.span<2) return lane;
    const cells=lane.cells.slice();
    cells.splice(cellIndex,1,{...cell,span:cell.span-1},{id:newBoardId('c'),span:1,slots:[]});
    return {...lane,cells};
  }),[editLane]);

  // ── Slots ──────────────────────────────────────────────
  const addSlot=useCallback((laneId,cellId,domain)=>
    editCell(laneId,cellId,cell=>({...cell,
      slots:[...cell.slots,{id:newBoardId('s'),domain:domain||null}]})),[editCell]);
  const setSlotDomain=useCallback((laneId,cellId,slotId,domain)=>
    editCell(laneId,cellId,cell=>({...cell,
      slots:cell.slots.map(s=>s.id===slotId?{...s,domain:domain||null}:s)})),[editCell]);
  const removeSlot=useCallback((laneId,cellId,slotId)=>
    editCell(laneId,cellId,cell=>({...cell,
      slots:cell.slots.filter(s=>s.id!==slotId)})),[editCell]);

  /* One drop handler for both sources: a tile already on the board is lifted
     out of its cell first, a domain dragged in from the unplaced tray becomes a
     new slot. `beforeSlotId` is the slot it lands in front of, or null for the
     end of the cell. */
  const dropOn=useCallback((toLaneId,toCellId,beforeSlotId)=>{
    const payload=dragRef.current;
    dragRef.current=null; setDropHint(null);
    if(!payload) return;
    if(payload.kind==='slot'&&payload.slotId===beforeSlotId) return;
    let moving=null;
    const next=lanes.map(lane=>({...lane,
      cells:lane.cells.map(cell=>({...cell,slots:cell.slots.slice()}))}));
    if(payload.kind==='slot'){
      next.forEach(lane=>{
        if(lane.id!==payload.laneId) return;
        lane.cells.forEach(cell=>{
          if(cell.id!==payload.cellId) return;
          const i=cell.slots.findIndex(s=>s.id===payload.slotId);
          if(i>=0) moving=cell.slots.splice(i,1)[0];
        });
      });
    } else if(payload.kind==='domain'){
      moving={id:newBoardId('s'),domain:payload.domain};
    }
    if(!moving) return;
    setLanes(next.map(lane=>lane.id!==toLaneId?lane:{...lane,
      cells:lane.cells.map(cell=>{
        if(cell.id!==toCellId) return cell;
        const at=beforeSlotId?cell.slots.findIndex(s=>s.id===beforeSlotId):-1;
        const slots=cell.slots.slice();
        if(at>=0) slots.splice(at,0,moving); else slots.push(moving);
        return {...cell,slots};
      })}));
  },[lanes,setLanes]);

  const dropTarget=(laneId,cellId,slotId,hintId)=>({
    onDragOver:e=>{ if(!dragRef.current) return; e.preventDefault(); e.stopPropagation();
                    e.dataTransfer.dropEffect='move'; setDropHint(hintId); },
    onDragLeave:()=>setDropHint(hint=>hint===hintId?null:hint),
    onDrop:e=>{ e.preventDefault(); e.stopPropagation(); dropOn(laneId,cellId,slotId); }
  });
  const dragSource=payload=>({
    draggable:editing,
    onDragStart:e=>{ dragRef.current=payload; e.dataTransfer.effectAllowed='move';
                     try{ e.dataTransfer.setData('text/plain',payload.domain||payload.slotId||''); }catch(_){} },
    onDragEnd:()=>{ dragRef.current=null; setDropHint(null); }
  });

  /* The entity list behind an opened tile, grouped the way the model groups it.
     Products with no subdomain fall into a trailing "other" bucket rather than
     being dropped or given a made-up group. */
  const entityGroups=useCallback(dname=>{
    const tables=(graphData.domainHierarchy[dname]||{}).tables||{};
    const groups={};
    Object.entries(tables).forEach(([tname,tdata])=>{
      const key=tdata.subdomain||'';
      (groups[key]=groups[key]||[]).push({...tdata,name:tname});
    });
    return Object.keys(groups)
      .sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b))
      .map(key=>[key,groups[key].sort((a,b)=>a.name.localeCompare(b.name))]);
  },[graphData]);

  function renderTile(lane,cell,slot){
    const dname=slot.domain;
    const ddata=dname?(graphData.domainHierarchy[dname]||{}):null;
    const chip=hueChip(hueOfSlot(ddata&&(ddata.slot||(graphData.domainSlots||{})[dname])));
    const stats=(dname&&(graphData.domainStats||{})[dname])||{};
    const open=!editing&&dname&&openDomain===dname;
    const drop=dropHint===slot.id?' bmap-drop':'';
    const moves={...dragSource({kind:'slot',laneId:lane.id,cellId:cell.id,slotId:slot.id}),
                 ...dropTarget(lane.id,cell.id,slot.id,slot.id)};

    if(!dname) return h('div',{key:slot.id,className:'bmap-tile bmap-vacant'+drop,...moves},
      h('div',{style:{display:'flex',alignItems:'center',gap:6}},
        h('span',{style:{fontSize:10.5,fontWeight:700,flex:1}},'Empty slot'),
        h('button',{className:'bmap-x',title:'Remove this slot',
          onClick:()=>removeSlot(lane.id,cell.id,slot.id)},'✕')),
      h('select',{value:'',style:{width:'100%',padding:'4px 6px',fontSize:11},
        'aria-label':'Domain for this slot',
        onChange:e=>setSlotDomain(lane.id,cell.id,slot.id,e.target.value)},
        h('option',{value:''},'— pick a domain —'),
        domainNames.map(d=>h('option',{key:d,value:d},
          d.replace(/_/g,' ')+(placed.has(d)?'  (placed)':''))))
    );

    const subdomains=Object.keys((ddata&&ddata.subdomains)||{}).sort();
    return h('div',{key:slot.id,
        className:'bmap-tile'+(open?' open':'')+(editing?'':' pick')+drop,
        style:{...chip,borderLeft:`4px solid ${ddata.color||'var(--brand)'}`},
        ...moves,
        role:editing?undefined:'button',
        tabIndex:editing?undefined:0,
        'aria-expanded':editing?undefined:!!open,
        onClick:editing?undefined:()=>onOpenDomain(open?null:dname),
        onKeyDown:editing?undefined:e=>{
          if(e.key==='Enter'||e.key===' '){ e.preventDefault(); onOpenDomain(open?null:dname); }
        }},

      h('div',{style:{display:'flex',alignItems:'center',gap:6}},
        editing&&h('span',{className:'bmap-grip',title:'Drag to move this domain'},'⁙'),
        h('span',{className:'bmap-tile-name',style:{flex:1}},dname.replace(/_/g,' ')),
        !editing&&h('span',{style:{fontSize:10,opacity:.7}},open?'▾':'▸'),
        editing&&h('button',{className:'bmap-x',title:'Clear this slot',
          onClick:e=>{e.stopPropagation();removeSlot(lane.id,cell.id,slot.id);}},'✕')
      ),

      editing
        ? h('select',{value:dname,style:{width:'100%',padding:'4px 6px',fontSize:11},
            'aria-label':'Domain for this slot',
            onClick:e=>e.stopPropagation(),
            onChange:e=>setSlotDomain(lane.id,cell.id,slot.id,e.target.value)},
            h('option',{value:''},'— empty —'),
            domainNames.map(d=>h('option',{key:d,value:d},
              d.replace(/_/g,' ')+(placed.has(d)&&d!==dname?'  (placed)':''))))
        : h(React.Fragment,null,
            ddata.description&&h('div',{className:'bmap-tile-desc'},ddata.description),
            h('div',{style:{display:'flex',gap:9,fontSize:10,fontWeight:700,opacity:.9}},
              h('span',null,fmtCount(stats.table_count)+' entities'),
              h('span',null,fmtCount(stats.attr_count)+' attrs'),
              stats.fk_count?h('span',null,fmtCount(stats.fk_count)+' FKs'):null),
            subdomains.length>0&&h('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
              subdomains.slice(0,open?subdomains.length:3).map(sd=>
                h('span',{key:sd,className:'bmap-sub'},sd.replace(/_/g,' '))),
              !open&&subdomains.length>3&&h('span',{className:'bmap-sub'},'+'+(subdomains.length-3)))
          ),

      open&&h('div',{style:{marginTop:4,paddingTop:8,borderTop:'1px solid var(--veil)',
                            maxHeight:340,overflowY:'auto'},
          onClick:e=>e.stopPropagation()},
        entityGroups(dname).map(([sub,rows])=>h('div',{key:sub||'__other',style:{marginBottom:6}},
          h('div',{style:{fontSize:9.5,fontWeight:800,letterSpacing:'.06em',
                          textTransform:'uppercase',opacity:.7,margin:'4px 4px 3px'}},
            (sub||'other').replace(/_/g,' ')),
          rows.map(row=>h('button',{key:row.name,type:'button',
              className:'bmap-row'+(selectedEntityId===row.full_id?' sel':''),
              title:row.description||row.name,
              onClick:()=>onEntityClick(row.full_id)},
            h('b',null,row.name.replace(/_/g,' ')),
            h('small',null,fmtCount(row.attribute_count)+' attrs'),
            row.fk_count?h('small',{style:{color:'var(--danger)'}},row.fk_count+' FK'):null))
        ))
      )
    );
  }

  function renderCell(lane,cell,cellIndex,start){
    const covered=columns.slice(start,start+cell.span);
    const label=covered.map(c=>c.name||'Untitled').join(' + ');
    const hintId='cell:'+cell.id;
    return h('div',{key:cell.id,className:'bmap-cell'+(dropHint===hintId?' bmap-drop':''),
        style:{gridColumn:'span '+cell.span},
        ...dropTarget(lane.id,cell.id,null,hintId)},
      // Which operating models this cell covers only needs saying when there is
      // more than one of them, or when a cell has been stretched over several.
      (ncols>1&&editing)&&h('div',{className:'bmap-cell-head'},
        h('span',{style:{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',
                         whiteSpace:'nowrap'}},label),
        cell.span>1&&h('button',{className:'tbtn',style:{height:19,fontSize:9.5},
          title:'Split the last operating model back out of this cell',
          onClick:()=>splitCell(lane.id,cellIndex)},'Split'),
        cellIndex<lane.cells.length-1&&h('button',{className:'tbtn',style:{height:19,fontSize:9.5},
          title:'Stretch this cell over the next operating model too',
          onClick:()=>mergeRight(lane.id,cellIndex)},'Merge →')
      ),
      h('div',{className:'bmap-grid'},
        cell.slots.map(slot=>renderTile(lane,cell,slot)),
        // The one affordance for filling a cell: press it for a slot with a
        // dropdown, or drag a domain straight onto it.
        editing&&h('button',{key:'__add',type:'button',
          className:'bmap-add'+(dropHint===('add:'+cell.id)?' bmap-drop':''),
          title:'Click to add a slot here, or drag a domain onto it',
          onClick:()=>addSlot(lane.id,cell.id,null),
          ...dropTarget(lane.id,cell.id,null,'add:'+cell.id)},
          '+ Add domain')
      )
    );
  }

  function renderLane(lane,index){
    const filled=lane.cells.reduce((n,c)=>n+c.slots.filter(s=>s.domain).length,0);
    const starts=cellStarts(lane);
    const stretched=lane.cells.length===1&&ncols>1;
    return h('div',{key:lane.id,className:'bmap-lane'},
      h('div',{className:'bmap-lane-head'},
        editing
          ? h('input',{type:'text',value:lane.name,maxLength:48,
              placeholder:'Lane name','aria-label':'Lane name',
              style:{width:230,flexShrink:0,padding:'4px 8px',fontSize:12},
              onChange:e=>editLane(lane.id,l=>({...l,name:e.target.value}))})
          : h('span',{className:'bmap-lane-name',style:{flex:1,minWidth:0}},
              lane.name||'Untitled lane'),
        h('span',{style:{fontSize:10,color:'var(--faint)',flexShrink:0,
                         marginLeft:editing?'auto':0}},
          filled+' domains'),
        editing&&h(React.Fragment,null,
          ncols>1&&h('button',{className:'tbtn',
            title:stretched?'Cut this lane back to one cell per operating model'
                           :'Stretch this lane across every operating model',
            onClick:()=>stretched?unstretchLane(lane.id):stretchLane(lane.id)},
            stretched?'⇔ Unstretch':'⇔ Stretch'),
          h('button',{className:'bmap-x',title:'Move this lane up',disabled:index===0,
            onClick:()=>moveLane(lane.id,-1)},'▲'),
          h('button',{className:'bmap-x',title:'Move this lane down',disabled:index===lanes.length-1,
            onClick:()=>moveLane(lane.id,1)},'▼'),
          h('button',{className:'bmap-x',title:'Remove this lane',
            onClick:()=>removeLane(lane)},'✕'))
      ),
      h('div',{className:'bmap-cells',style:{gridTemplateColumns:gridCols}},
        lane.cells.map((cell,ci)=>renderCell(lane,cell,ci,starts[ci])))
    );
  }

  return h('div',{style:{position:'absolute',inset:0,overflow:'auto',
                         padding:'0 20px 40px',background:'var(--bg)'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',
                    paddingTop:16,marginBottom:12}},
      h('div',{style:{flex:1,minWidth:200}},
        h('div',{style:{fontSize:13,fontWeight:800,color:'var(--ink)'}},'Business domain map'),
        h('div',BMAP_HINT,editing
          ? 'Columns are operating models, lanes run across them. Press “+ Add domain” in a cell, or drag a tile anywhere.'
          : 'Click a domain to list its entities · click an entity for its details')),
      h('button',{className:'tbtn '+(editing?'on':''),'aria-pressed':editing,
        title:'Assign domains to slots and rearrange the lanes and operating models',
        onClick:()=>{ setEditing(v=>!v); onOpenDomain(null); }},
        editing?'Done':'Edit map'),
      editing&&h('button',{className:'tbtn',title:'Add another operating model column',
        disabled:ncols>=BOARD_COL_CAP,onClick:addColumn},'+ Operating model'),
      editing&&h('button',{className:'tbtn',title:'Add another lane',
        disabled:lanes.length>=BOARD_LANE_CAP,onClick:addLane},'+ Lane'),
      editing&&h('button',{className:'tbtn',
        title:'Rebuild the lanes from the model’s divisions, keeping the operating models',
        onClick:()=>{ if(window.confirm('Rebuild the lanes from the model’s divisions? '+
                                        'The operating model columns are kept; the current lanes are lost.'))
                        commit({columns,lanes:seedLanes(graphData,ncols)}); }},'Reset lanes')
    ),

    /* The operating models, once there is more than one to tell apart. It rides
       above the lanes and lines up with them because it is the same grid at the
       same inset. */
    ncols>1&&h('div',{className:'bmap-colhead',style:{gridTemplateColumns:gridCols}},
      columns.map((col,i)=>h('div',{key:col.id,className:'bmap-colcell'},
        editing
          ? h(React.Fragment,null,
              h('input',{type:'text',value:col.name,maxLength:40,
                placeholder:'Operating model','aria-label':'Operating model name',
                style:{flex:1,minWidth:0,padding:'3px 7px',fontSize:11.5},
                onChange:e=>renameColumn(col.id,e.target.value)}),
              h('button',{className:'bmap-x',title:i===0?'Already leftmost'
                  :canSwap(i-1,i)?'Move left':'A lane is stretched across these two columns',
                disabled:i===0||!canSwap(i-1,i),onClick:()=>moveColumn(i,-1)},'◀'),
              h('button',{className:'bmap-x',title:i===ncols-1?'Already rightmost'
                  :canSwap(i,i+1)?'Move right':'A lane is stretched across these two columns',
                disabled:i===ncols-1||!canSwap(i,i+1),onClick:()=>moveColumn(i,1)},'▶'),
              h('button',{className:'bmap-x',title:'Remove this operating model',
                onClick:()=>removeColumn(i)},'✕'))
          : h('span',{className:'bmap-colname'},col.name||'Untitled')
      ))
    ),

    lanes.map(renderLane),

    !lanes.length&&h('div',{style:{textAlign:'center',padding:'40px 0',...BMAP_HINT}},
      'No lanes yet. Press “Edit map”, then “+ Lane”.'),

    /* Nothing is allowed to vanish silently: a domain that is on no tile is
       still in the model, so it sits here until it is placed. */
    editing&&h('div',{style:{marginTop:6}},
      h('div',{style:{fontSize:11,fontWeight:800,letterSpacing:'.06em',
                      textTransform:'uppercase',color:'var(--muted)',marginBottom:7}},
        'Not on the map ('+unplaced.length+')'),
      unplaced.length
        ? h('div',{style:{display:'flex',flexWrap:'wrap',gap:6}},
            unplaced.map(d=>{
              const ddata=graphData.domainHierarchy[d]||{};
              const chip=hueChip(hueOfSlot(ddata.slot||(graphData.domainSlots||{})[d]));
              return h('span',{key:d,draggable:true,title:'Drag onto a cell',
                style:{...chip,padding:'4px 9px',borderRadius:20,fontSize:11,
                       fontWeight:700,cursor:'grab'},
                ...dragSource({kind:'domain',domain:d})},
                d.replace(/_/g,' '));
            }))
        : h('div',BMAP_HINT,'Every domain in the model is on the map.')),

    !editing&&unplaced.length>0&&h('div',{style:{marginTop:4,...BMAP_HINT}},
      unplaced.length+' domain'+(unplaced.length===1?' is':'s are')+' not on the map. ',
      h('button',{className:'loadjson',onClick:()=>setEditing(true)},'Place them'))
  );
}

function fmtBytes(n){
  if(!n&&n!==0) return '';
  if(n<1024) return n+' B';
  if(n<1048576) return (n/1024).toFixed(0)+' KB';
  return (n/1048576).toFixed(n<10485760?1:0)+' MB';
}
/* Grouped in full rather than abbreviated: the top line is now the only place
   these counts appear, so "6.4k" would throw away detail nothing else shows. */
function fmtCount(n){
  if(n==null) return '—';
  return Number(n).toLocaleString('en-US');
}

function findIndustry(manifest,slug){
  return (manifest.industries||[]).find(i=>i.slug===slug)||null;
}
function sortIndustries(list){
  return (list||[]).slice().sort((a,b)=>
    String(a.display||a.slug).localeCompare(String(b.display||b.slug),undefined,{sensitivity:'base'}));
}
function findEntry(industry,version,flavour){
  if(!industry) return null;
  const v=(industry.versions||[]).find(x=>x.version===version)
        ||(industry.versions||[]).find(x=>x.version===industry.latest);
  if(!v) return null;
  const f=(v.flavours||[]).find(x=>x.flavour===flavour)||(v.flavours||[])[0];
  return f?{...f,version:v.version}:null;
}

/* Repo landing page on upstream, deliberately unpinned: the wordmark should
   lead to the canonical project, not to whichever fork served this build. */
function repoHomeLink(){
  return `https://github.com/${UPSTREAM_REPO.owner}/${UPSTREAM_REPO.repo}`;
}

/* The GitHub page for model.json's own folder on upstream, where GitHub renders
   that model's readme beside its docs, metrics and diagram. Uses main on
   upstream so a fork-only commit SHA does not 404 when the visitor clicks through. */
function modelDirLink(_source,entry){
  if(!entry||!entry.path) return '';
  const dir=entry.path.replace(/\/[^/]+$/,'');
  if(!dir||dir===entry.path) return '';
  return `https://github.com/${UPSTREAM_REPO.owner}/${UPSTREAM_REPO.repo}/tree/main/${dir}`;
}

/* Industry models always load from the canonical upstream repo on main, even when
   manifest.source points at a fork's Pages build. Paths still come from the manifest. */
function modelUrls(path,bytes){
  const {owner,repo}=UPSTREAM_REPO;
  const ref='main';
  const raw=`https://raw.githubusercontent.com/${owner}/${repo}/${ref}/${path}`;
  if(bytes>JSDELIVR_MAX_BYTES) return [raw];
  return [`https://cdn.jsdelivr.net/gh/${owner}/${repo}@${ref}/${path}`,raw];
}

function modelDocsXlsxPath(slug,version,flavour){
  return `data-models/${slug}/${version}/${flavour}/docs/${slug}_model_${version}_${flavour}.xlsx`;
}
function modelDocsXlsxUrl(slug,version,flavour){
  const path=modelDocsXlsxPath(slug,version,flavour);
  const {owner,repo}=UPSTREAM_REPO;
  return `https://raw.githubusercontent.com/${owner}/${repo}/main/${path}`;
}
function downloadUpstreamFile(url,filename){
  return fetch(url).then(res=>{
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.blob();
  }).then(blob=>{
    const obj=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=obj; a.download=filename; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(obj);
  });
}

/* Progress is measured in DECODED bytes, which is what the stream yields, so
   the manifest's uncompressed blob size is the right denominator even though
   the transfer itself is gzipped. */
async function fetchModelJson(urls,expectedBytes,onProgress){
  let lastErr=null;
  for(const url of urls){
    try{
      const res=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
      if(!res.body||typeof res.body.getReader!=='function'){
        onProgress&&onProgress(expectedBytes,expectedBytes);
        return await res.json();
      }
      const reader=res.body.getReader(), chunks=[];
      let received=0;
      for(;;){
        const {done,value}=await reader.read();
        if(done) break;
        chunks.push(value); received+=value.length;
        onProgress&&onProgress(received,expectedBytes);
      }
      const buf=new Uint8Array(received);
      let at=0;
      for(const c of chunks){buf.set(c,at);at+=c.length;}
      return JSON.parse(new TextDecoder('utf-8').decode(buf));
    }catch(e){ lastErr=e; }
  }
  throw new Error((lastErr&&lastErr.message)||'all sources failed');
}

function CommandPalette({manifest,onPick,onClose}){
  const [q,setQ]=useState('');
  const [cursor,setCursor]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current&&inputRef.current.focus();},[]);

  const hits=useMemo(()=>{
    const needle=q.trim().toLowerCase();
    const all=sortIndustries(manifest.industries);
    if(!needle) return all.slice(0,60);
    return all.filter(i=>
      i.display.toLowerCase().includes(needle)||
      i.slug.includes(needle)||
      i.section.toLowerCase().includes(needle)).slice(0,60);
  },[q,manifest]);
  useEffect(()=>{setCursor(0);},[q]);

  const onKey=e=>{
    if(e.key==='Escape'){onClose();return;}
    if(e.key==='ArrowDown'){e.preventDefault();setCursor(c=>Math.min(hits.length-1,c+1));return;}
    if(e.key==='ArrowUp'){e.preventDefault();setCursor(c=>Math.max(0,c-1));return;}
    if(e.key==='Enter'&&hits[cursor]){e.preventDefault();onPick(hits[cursor].slug);}
  };

  return h('div',{className:'scrim',onMouseDown:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'palette',role:'dialog','aria-label':'Jump to industry'},
      h('div',{className:'palette-head'},
        h('input',{ref:inputRef,type:'text',value:q,onChange:e=>setQ(e.target.value),
          onKeyDown:onKey,placeholder:'Jump to an industry…','aria-label':'Industry name'}),
        h('div',{style:{marginTop:7,fontSize:11,color:'var(--faint)'}},
          hits.length+' of '+(manifest.industries||[]).length+' industries · ↑↓ to move · Enter to open · Esc to close')
      ),
      h('div',{className:'palette-list'},
        hits.length===0
          ? h('div',{style:{padding:'18px 12px',color:'var(--muted)',fontSize:13}},'No industry matches that.')
          : hits.map((i,n)=>h('button',{key:i.slug,
              className:'palette-row'+(n===cursor?' cursor':''),
              onMouseEnter:()=>setCursor(n),
              onClick:()=>onPick(i.slug)},
              h('span',{style:{width:8,height:8,borderRadius:2,flexShrink:0,
                background:'var('+DOMAIN_SLOTS[n%DOMAIN_SLOTS.length]+')'}}),
              h('span',null,i.display),
              h('small',null,i.section)
            ))
      )
    )
  );
}

function Tour({onClose,getNodeRect}){
  const [index,setIndex]=useState(0);
  const [hole,setHole]=useState(null);
  const [pos,setPos]=useState(null);
  const [tick,setTick]=useState(0);
  const dirRef=useRef(1);
  const popRef=useRef(null);
  const PAD=6, GAP=14, PW=304;

  const rectFor=useCallback(step=>{
    if(step.target==='graph-node'){
      const r=getNodeRect&&getNodeRect();
      if(r&&r.width>0) return r;
      const el=document.querySelector('[data-tour="graph"]');
      if(el){
        const b=el.getBoundingClientRect();
        const w=Math.min(340,b.width*0.5),hh=Math.min(220,b.height*0.5);
        return {left:b.left+(b.width-w)/2,top:b.top+(b.height-hh)/2,width:w,height:hh};
      }
      return null;
    }
    const el=document.querySelector('[data-tour="'+step.target+'"]');
    if(!el) return null;
    const b=el.getBoundingClientRect();
    if(b.width===0&&b.height===0) return null;
    return {left:b.left,top:b.top,width:b.width,height:b.height};
  },[getNodeRect]);

  const go=useCallback(d=>{
    dirRef.current=d;
    setIndex(i=>{
      const ni=i+d;
      if(ni<0) return i;
      if(ni>=TOUR_STEPS.length){ onClose(true); return i; }
      return ni;
    });
  },[onClose]);

  useLayoutEffect(()=>{
    const step=TOUR_STEPS[index];
    if(!step) return;
    const r=rectFor(step);
    if(!r){
      const ni=index+dirRef.current;
      if(ni<0||ni>=TOUR_STEPS.length){ onClose(true); return; }
      setIndex(ni);
      return;
    }
    const h0={left:r.left-PAD,top:r.top-PAD,width:r.width+2*PAD,height:r.height+2*PAD};
    setHole(h0);
    const vw=window.innerWidth,vh=window.innerHeight;
    const ph=popRef.current?popRef.current.offsetHeight:160;
    let place=step.place||'bottom',left,top;
    if(place==='right'){
      left=h0.left+h0.width+GAP; top=h0.top;
      if(left+PW>vw-8){ place='bottom'; }
    }
    if(place==='bottom'||place==='top'){
      left=h0.left+h0.width/2-PW/2;
      if(place==='bottom'){
        top=h0.top+h0.height+GAP;
        if(top+ph>vh-8&&h0.top-GAP-ph>8){ place='top'; top=h0.top-GAP-ph; }
      }else{
        top=h0.top-GAP-ph;
        if(top<8){ place='bottom'; top=h0.top+h0.height+GAP; }
      }
    }
    left=Math.max(8,Math.min(left,vw-PW-8));
    top=Math.max(8,Math.min(top,vh-ph-8));
    setPos({left,top});
  },[index,tick,rectFor,onClose]);

  useEffect(()=>{
    const bump=()=>setTick(t=>t+1);
    window.addEventListener('resize',bump);
    window.addEventListener('scroll',bump,true);
    const key=e=>{
      if(e.key==='Escape'){ e.preventDefault(); onClose(false); }
      else if(e.key==='ArrowRight'||e.key==='Enter'){ e.preventDefault(); go(1); }
      else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
    };
    window.addEventListener('keydown',key);
    return ()=>{
      window.removeEventListener('resize',bump);
      window.removeEventListener('scroll',bump,true);
      window.removeEventListener('keydown',key);
    };
  },[go,onClose]);

  const step=TOUR_STEPS[index];
  if(!step||!hole) return null;
  const last=index===TOUR_STEPS.length-1;
  return h(React.Fragment,null,
    h('div',{className:'tour-catch',style:{position:'fixed',inset:0,zIndex:5999},
      onClick:()=>onClose(false)}),
    h('div',{className:'tour-hole',style:{left:hole.left,top:hole.top,width:hole.width,height:hole.height}}),
    h('div',{className:'tour-pop',ref:popRef,
        style:pos?{left:pos.left,top:pos.top}:{left:-9999,top:-9999},
        onClick:e=>e.stopPropagation()},
      h('h4',null,step.title),
      h('p',null,step.body),
      h('div',{className:'tour-row'},
        h('span',{className:'tour-step'},(index+1)+' / '+TOUR_STEPS.length),
        h('button',{className:'tour-skip',onClick:()=>onClose(false)},'Skip'),
        index>0&&h('button',{className:'btn',onClick:()=>go(-1)},'Back'),
        h('button',{className:'btn btn-accent',onClick:()=>go(1)},last?'Done':'Next')
      )
    )
  );
}

/* ── SQL-DBM style orthogonal connector routing ──────────────
   Relationship lines never cross a table. Every card is inflated by a
   clearance pad, the free space around them becomes a Hanan grid (one channel
   per inflated card edge, plus a few evenly spaced ones inside each gutter),
   grid segments that cut through a card are struck out, and a line is drawn
   along what is left. Most links get the two-corner "out, across, in" route
   SQL DBM favours; anything that has no clear column falls back to an A*
   search over the same grid. Corners and already-used channel segments both
   cost extra, so routes stay straight and parallel runs fan out across the
   gutter instead of stacking into one thick smear. */
const ERD_PAD=18;        // clearance between a card and the nearest channel
const ERD_STUB=30;       // straight run off the card edge before the first turn
const ERD_BEND=60;       // cost of a corner, expressed in pixels of detour
const ERD_REUSE=45;      // cost of sharing one channel segment with another line
const ERD_REUSE_CAP=3;   // past this many sharers a channel stops getting worse,
                         // so a saturated diagram degrades into neat bundles
                         // rather than into ever wilder detours
const ERD_MARGIN=40;     // routable space outside the outermost cards
const ERD_RADIUS=8;      // corner rounding
const ERD_DETOUR=2.4;    // reject a two-corner route this much longer than direct
const ERD_BUDGET_MS=500; // once spent, remaining links skip the A* fallback
const ERD_EPS=0.01;

function erdUniq(values,lo,hi){
  const seen=new Set(),out=[];
  values.forEach(v=>{
    if(!isFinite(v))return;
    const r=Math.round(Math.min(hi,Math.max(lo,v))*2)/2;
    if(!seen.has(r)){seen.add(r);out.push(r);}
  });
  return out.sort((a,b)=>a-b);
}

// Widen the grid inside real gutters so several lines can run side by side.
// Gaps wider than maxGap are card interiors and get no extra channels.
function erdFill(sorted,maxGap){
  const out=[];
  for(let i=0;i<sorted.length;i++){
    out.push(sorted[i]);
    if(i+1>=sorted.length)continue;
    const gap=sorted[i+1]-sorted[i];
    if(gap<=14||gap>maxGap)continue;
    const steps=Math.min(5,Math.floor(gap/12));
    for(let s=1;s<steps;s++)out.push(sorted[i]+gap*s/steps);
  }
  return out;
}

function erdUpper(arr,v){ // index of the first entry strictly greater than v
  let lo=0,hi=arr.length;
  while(lo<hi){const mid=(lo+hi)>>1;if(arr[mid]<=v)lo=mid+1;else hi=mid;}
  return lo;
}
function erdNearest(arr,v){
  const i=erdUpper(arr,v);
  if(i===0)return 0;
  if(i>=arr.length)return arr.length-1;
  return (v-arr[i-1]<=arr[i]-v)?i-1:i;
}

function ErdHeap(){this.f=[];this.v=[];}
ErdHeap.prototype.push=function(f,v){
  const F=this.f,V=this.v;let i=F.length;F.push(f);V.push(v);
  while(i>0){
    const p=(i-1)>>1;
    if(F[p]<=F[i])break;
    const tf=F[p];F[p]=F[i];F[i]=tf;const tv=V[p];V[p]=V[i];V[i]=tv;i=p;
  }
};
ErdHeap.prototype.pop=function(){
  const F=this.f,V=this.v,top=V[0],lf=F.pop(),lv=V.pop();
  if(F.length){
    F[0]=lf;V[0]=lv;
    let i=0;
    for(;;){
      const l=i*2+1,r=l+1;let m=i;
      if(l<F.length&&F[l]<F[m])m=l;
      if(r<F.length&&F[r]<F[m])m=r;
      if(m===i)break;
      const tf=F[m];F[m]=F[i];F[i]=tf;const tv=V[m];V[m]=V[i];V[i]=tv;i=m;
    }
  }
  return top;
};

function erdBuildRouter(rects,anchors,bounds){
  const xsRaw=[bounds.left,bounds.right],ysRaw=[bounds.top,bounds.bottom];
  rects.forEach(r=>{
    xsRaw.push(r.left-ERD_PAD,r.right+ERD_PAD);
    ysRaw.push(r.top-ERD_PAD,r.bottom+ERD_PAD);
  });
  anchors.forEach(a=>{xsRaw.push(a.x);ysRaw.push(a.y);});
  const xs=erdFill(erdUniq(xsRaw,bounds.left,bounds.right),260);
  const ys=erdFill(erdUniq(ysRaw,bounds.top,bounds.bottom),260);
  const nx=xs.length,ny=ys.length;
  const hFree=new Uint8Array(ny*Math.max(1,nx-1)).fill(1);
  const vFree=new Uint8Array(nx*Math.max(1,ny-1)).fill(1);
  rects.forEach(r=>{
    const L=r.left-ERD_PAD,R=r.right+ERD_PAD,T=r.top-ERD_PAD,B=r.bottom+ERD_PAD;
    const j0=erdUpper(ys,T+ERD_EPS),j1=erdUpper(ys,B-ERD_EPS)-1;
    const i0=Math.max(0,erdUpper(xs,L+ERD_EPS)-1),i1=Math.min(nx-2,erdUpper(xs,R-ERD_EPS)-1);
    for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++)hFree[j*(nx-1)+i]=0;
    const a0=erdUpper(xs,L+ERD_EPS),a1=erdUpper(xs,R-ERD_EPS)-1;
    const b0=Math.max(0,erdUpper(ys,T+ERD_EPS)-1),b1=Math.min(ny-2,erdUpper(ys,B-ERD_EPS)-1);
    for(let i=a0;i<=a1;i++)for(let j=b0;j<=b1;j++)vFree[i*(ny-1)+j]=0;
  });
  // running counts of struck-out segments, so "is this whole run clear?" is O(1)
  const hBlock=new Int32Array(ny*nx),vBlock=new Int32Array(nx*ny);
  for(let j=0;j<ny;j++){let acc=0;for(let i=0;i<nx-1;i++){if(!hFree[j*(nx-1)+i])acc++;hBlock[j*nx+i+1]=acc;}}
  for(let i=0;i<nx;i++){let acc=0;for(let j=0;j<ny-1;j++){if(!vFree[i*(ny-1)+j])acc++;vBlock[i*ny+j+1]=acc;}}
  const states=nx*ny*2;
  return {xs,ys,nx,ny,hFree,vFree,hBlock,vBlock,
    hUse:new Float32Array(hFree.length),vUse:new Float32Array(vFree.length),
    dist:new Float64Array(states),prev:new Int32Array(states),
    seen:new Int32Array(states),gen:0};
}

function erdRowClear(R,j,a,b){
  const lo=Math.min(a,b),hi=Math.max(a,b);
  return R.hBlock[j*R.nx+hi]-R.hBlock[j*R.nx+lo]===0;
}
function erdColClear(R,i,a,b){
  const lo=Math.min(a,b),hi=Math.max(a,b);
  return R.vBlock[i*R.ny+hi]-R.vBlock[i*R.ny+lo]===0;
}
function erdRowUse(R,j,a,b){
  let sum=0;
  for(let i=Math.min(a,b);i<Math.max(a,b);i++)sum+=Math.min(R.hUse[j*(R.nx-1)+i],ERD_REUSE_CAP);
  return sum*ERD_REUSE;
}
function erdColUse(R,i,a,b){
  let sum=0;
  for(let j=Math.min(a,b);j<Math.max(a,b);j++)sum+=Math.min(R.vUse[i*(R.ny-1)+j],ERD_REUSE_CAP);
  return sum*ERD_REUSE;
}

/* The common case: leave along the source row, drop down one clear column,
   arrive along the target row. Two corners at most - the shape SQL DBM draws
   for almost every relationship. Returns null when no column works, or when
   the only one that does is a wild detour. */
function erdStraightRoute(R,si,sj,ti,tj,maxDetour){
  const {xs,ys,nx}=R;
  const direct=Math.abs(xs[ti]-xs[si])+Math.abs(ys[tj]-ys[sj]);
  let best=null;
  for(let c=0;c<nx;c++){
    if(!erdRowClear(R,sj,si,c))continue;
    if(!erdRowClear(R,tj,c,ti))continue;
    if(!erdColClear(R,c,sj,tj))continue;
    const length=Math.abs(xs[c]-xs[si])+Math.abs(xs[ti]-xs[c])+Math.abs(ys[tj]-ys[sj]);
    if(length>direct*maxDetour+ERD_STUB*4)continue;
    const bends=(sj!==tj?(c!==si?1:0)+(c!==ti?1:0):0)*ERD_BEND;
    const cost=length+bends+erdRowUse(R,sj,si,c)+erdRowUse(R,tj,c,ti)+erdColUse(R,c,sj,tj);
    if(!best||cost<best.cost)best={c,cost};
  }
  if(!best)return null;
  return [{x:xs[si],y:ys[sj],_i:si,_j:sj},{x:xs[best.c],y:ys[sj],_i:best.c,_j:sj},
    {x:xs[best.c],y:ys[tj],_i:best.c,_j:tj},{x:xs[ti],y:ys[tj],_i:ti,_j:tj}];
}

/* Last resort when nothing else fits: hug the outside of the diagram. Both
   stubs sit in a gutter, and the margin rows above and below every card are
   clear by construction, so this almost always has somewhere to go. */
function erdPerimeterRoute(R,si,sj,ti,tj){
  const {xs,ys,ny}=R;
  for(const jm of (sj+tj)/2<ny/2?[0,ny-1]:[ny-1,0]){
    if(!erdColClear(R,si,sj,jm))continue;
    if(!erdRowClear(R,jm,si,ti))continue;
    if(!erdColClear(R,ti,jm,tj))continue;
    return [{x:xs[si],y:ys[sj],_i:si,_j:sj},{x:xs[si],y:ys[jm],_i:si,_j:jm},
      {x:xs[ti],y:ys[jm],_i:ti,_j:jm},{x:xs[ti],y:ys[tj],_i:ti,_j:tj}];
  }
  return null;
}

/* Fallback for links with no clear column: A* over the same grid. State is
   (node, direction of arrival) so a corner can be priced. Both ends are
   approached horizontally, because the stubs leave the card sideways. */
function erdSolve(R,si,sj,ti,tj){
  const {xs,ys,nx,ny,hFree,vFree,hUse,vUse,dist,prev,seen}=R;
  if(nx<2||ny<2)return null;
  const gen=++R.gen; // stamp instead of clearing three arrays per route
  const goal=((tj*nx+ti)<<1),gx=xs[ti],gy=ys[tj];
  const start=((sj*nx+si)<<1);
  const heap=new ErdHeap();
  dist[start]=0;prev[start]=-1;seen[start]=gen;
  heap.push(Math.abs(xs[si]-gx)+Math.abs(ys[sj]-gy),start);
  let found=false;
  const done=new Set();
  while(heap.f.length){
    const s=heap.pop();
    if(done.has(s))continue;
    done.add(s);
    if(s===goal){found=true;break;}
    const d=s&1,n=s>>1,i=n%nx,j=(n-i)/nx,g=dist[s];
    for(let k=0;k<4;k++){
      const vertical=k>1,step=(k&1)?1:-1;
      let ni=i,nj=j,seg,free,use;
      if(vertical){
        nj=j+step;
        if(nj<0||nj>=ny)continue;
        seg=i*(ny-1)+Math.min(j,nj);
        free=vFree[seg];use=vUse[seg];
      }else{
        ni=i+step;
        if(ni<0||ni>=nx)continue;
        seg=j*(nx-1)+Math.min(i,ni);
        free=hFree[seg];use=hUse[seg];
      }
      if(!free)continue;
      const nd=vertical?1:0;
      const len=vertical?Math.abs(ys[nj]-ys[j]):Math.abs(xs[ni]-xs[i]);
      const ns=(((nj*nx+ni)<<1)|nd);
      const cost=g+len+(nd===d?0:ERD_BEND)+Math.min(use,ERD_REUSE_CAP)*ERD_REUSE;
      if(seen[ns]!==gen||cost<dist[ns]){
        seen[ns]=gen;dist[ns]=cost;prev[ns]=s;
        heap.push(cost+Math.abs(xs[ni]-gx)+Math.abs(ys[nj]-gy),ns);
      }
    }
  }
  if(!found)return null;
  const points=[];
  for(let s=goal;s>=0;s=prev[s]){
    const n=s>>1,i=n%nx,j=(n-i)/nx;
    points.push({x:xs[i],y:ys[j],_i:i,_j:j});
    if(s===start)break;
  }
  return points.reverse();
}

// charge the channels a finished route took, so the next one spreads out
function erdChargeRoute(R,points){
  const {nx,ny,hUse,vUse}=R;
  for(let p=1;p<points.length;p++){
    const a=points[p-1],b=points[p];
    if(a._j===b._j)for(let i=Math.min(a._i,b._i);i<Math.max(a._i,b._i);i++)hUse[a._j*(nx-1)+i]+=1;
    else for(let j=Math.min(a._j,b._j);j<Math.max(a._j,b._j);j++)vUse[a._i*(ny-1)+j]+=1;
  }
}

function erdSimplify(points){
  const out=[];
  points.forEach(p=>{
    const n=out.length;
    if(n&&Math.abs(out[n-1].x-p.x)<0.01&&Math.abs(out[n-1].y-p.y)<0.01)return;
    if(n>1){
      const a=out[n-2],b=out[n-1];
      const collinear=(Math.abs(a.x-b.x)<0.01&&Math.abs(b.x-p.x)<0.01)
        ||(Math.abs(a.y-b.y)<0.01&&Math.abs(b.y-p.y)<0.01);
      if(collinear){out[n-1]=p;return;}
    }
    out.push(p);
  });
  return out;
}

function erdPathD(points,radius){
  if(!points.length)return '';
  let d='M '+points[0].x+' '+points[0].y;
  for(let i=1;i<points.length-1;i++){
    const p=points[i],a=points[i-1],b=points[i+1];
    const inLen=Math.abs(p.x-a.x)+Math.abs(p.y-a.y);
    const outLen=Math.abs(b.x-p.x)+Math.abs(b.y-p.y);
    const r=Math.min(radius,inLen/2,outLen/2);
    if(r<1){d+=' L '+p.x+' '+p.y;continue;}
    const ix=p.x+(a.x-p.x)/inLen*r,iy=p.y+(a.y-p.y)/inLen*r;
    const ox=p.x+(b.x-p.x)/outLen*r,oy=p.y+(b.y-p.y)/outLen*r;
    d+=' L '+ix+' '+iy+' Q '+p.x+' '+p.y+' '+ox+' '+oy;
  }
  const last=points[points.length-1];
  return d+' L '+last.x+' '+last.y;
}

function SqlDbmErdView({graphData,filterState,erdCoreOnly,showDomains,erdZoom,selectedEdgeId,onTableClick,onEdgeClick,design}){
  const canvasRef=useRef(null);
  const surfaceRef=useRef(null);
  const cardRefs=useRef({});
  const rowRefs=useRef({});
  const [lines,setLines]=useState([]);
  const [expandedTables,setExpandedTables]=useState(new Set());

  const modelTables=useMemo(()=>{
    const result=[];
    Object.entries(graphData.domainHierarchy||{}).forEach(([domainName,domainData])=>{
      Object.entries(domainData.tables||{}).forEach(([tableName,tableData])=>{
        result.push({...tableData,name:tableName,domain:domainName,
          color:domainData.color||'var(--brand)',
          id:tableData.full_id||`${domainName}.${tableName}`});
      });
    });
    return result;
  },[graphData]);

  const visible={tables:[],edges:[]};
  const degree={};
  (graphData.edges||[]).forEach(edge=>{
    degree[edge.data.source]=(degree[edge.data.source]||0)+1;
    degree[edge.data.target]=(degree[edge.data.target]||0)+1;
  });
  const allIds=new Set(modelTables.map(table=>table.id));
  let visibleIds=allIds;
  if(erdCoreOnly){
    visibleIds=new Set(modelTables.slice().sort((a,b)=>
      (degree[b.id]||0)-(degree[a.id]||0)||a.id.localeCompare(b.id)
    ).slice(0,Math.max(12,Math.ceil(modelTables.length*0.2))).map(table=>table.id));
  }
  if(filterState.type==='custom'&&filterState.value&&Array.isArray(filterState.value.tables)){
    visibleIds=new Set(filterState.value.tables);
  }
  const focusId=filterState.type==='table'?filterState.value:null;
  if(focusId){
    const directEdges=(graphData.edges||[]).filter(edge=>edge.data.source===focusId);
    visibleIds=new Set([focusId,...directEdges.map(edge=>edge.data.target)]);
  }
  visible.tables=modelTables.filter(table=>visibleIds.has(table.id)).sort((a,b)=>{
    if(focusId) {
      if(a.id===focusId)return -1;
      if(b.id===focusId)return 1;
    }
    return a.domain.localeCompare(b.domain)||a.name.localeCompare(b.name);
  });
  visible.edges=(graphData.edges||[]).filter(edge=>
    visibleIds.has(edge.data.source)&&visibleIds.has(edge.data.target)
  );

  useLayoutEffect(()=>{
    let frame=0;
    const redraw=()=>{
      const surface=surfaceRef.current;
      if(!surface)return;
      const surfaceRect=surface.getBoundingClientRect();
      // the surface is CSS-scaled by erdZoom, but the SVG lives inside it and
      // therefore draws in unscaled coordinates - divide the measurements back
      const scale=surface.offsetWidth?surfaceRect.width/surface.offsetWidth:1;
      const toLocal=(rect)=>({
        left:(rect.left-surfaceRect.left)/scale,right:(rect.right-surfaceRect.left)/scale,
        top:(rect.top-surfaceRect.top)/scale,bottom:(rect.bottom-surfaceRect.top)/scale});

      const cardRects=[];
      const cardById={};
      Object.entries(cardRefs.current).forEach(([id,element])=>{
        if(!element||!element.isConnected)return;
        const rect={id,...toLocal(element.getBoundingClientRect())};
        cardRects.push(rect);cardById[id]=rect;
      });
      if(!cardRects.length){setLines([]);return;}

      const rowRect=(tableId,column)=>{
        const element=column&&rowRefs.current[`${tableId}:${column}`];
        return element&&element.isConnected?toLocal(element.getBoundingClientRect()):null;
      };

      // Work out where each line leaves its table. SQL DBM only ever attaches
      // to the left or right edge of a row, so the line runs into the gutter
      // immediately instead of climbing over the card.
      const plans=visible.edges.map(edge=>{
        const sourceCard=cardById[edge.data.source];
        const targetCard=cardById[edge.data.target];
        if(!sourceCard||!targetCard)return null;
        const targetTable=modelTables.find(table=>table.id===edge.data.target);
        const targetPk=targetTable&&(targetTable.attributes||[]).find(attribute=>attribute.pk);
        const sourceRow=rowRect(edge.data.source,edge.data.source_column)||sourceCard;
        const targetRow=rowRect(edge.data.target,edge.data.target_column)
          ||(targetPk&&rowRect(edge.data.target,targetPk.name))||targetCard;
        let sourceSide,targetSide;
        if(targetCard.left>=sourceCard.right-1){sourceSide=1;targetSide=-1;}
        else if(sourceCard.left>=targetCard.right-1){sourceSide=-1;targetSide=1;}
        else{
          // stacked in the same column: both ends leave on the roomier side
          const side=(surface.clientWidth-Math.max(sourceCard.right,targetCard.right))
            >=Math.min(sourceCard.left,targetCard.left)?1:-1;
          sourceSide=side;targetSide=side;
        }
        const start={x:sourceSide>0?sourceCard.right:sourceCard.left,
          y:(sourceRow.top+sourceRow.bottom)/2};
        const end={x:targetSide>0?targetCard.right:targetCard.left,
          y:(targetRow.top+targetRow.bottom)/2};
        return {edge,start,end,
          startStub:{x:start.x+sourceSide*ERD_STUB,y:start.y},
          endStub:{x:end.x+targetSide*ERD_STUB,y:end.y}};
      }).filter(Boolean);
      if(!plans.length){setLines([]);return;}

      const bounds={
        left:Math.min(...cardRects.map(r=>r.left))-ERD_PAD-ERD_MARGIN,
        right:Math.max(...cardRects.map(r=>r.right))+ERD_PAD+ERD_MARGIN,
        top:Math.min(...cardRects.map(r=>r.top))-ERD_PAD-ERD_MARGIN,
        bottom:Math.max(...cardRects.map(r=>r.bottom))+ERD_PAD+ERD_MARGIN};

      const anchors=[];
      plans.forEach(plan=>{anchors.push(plan.startStub,plan.endStub);});
      const router=erdBuildRouter(cardRects,anchors,bounds);
      const deadline=Date.now()+ERD_BUDGET_MS;

      // Short links first: they have the least room to manoeuvre, and routing
      // them before the long ones keeps them out of the far gutters.
      const order=plans.map((plan,index)=>({plan,index})).sort((a,b)=>
        (Math.abs(a.plan.startStub.x-a.plan.endStub.x)+Math.abs(a.plan.startStub.y-a.plan.endStub.y))
        -(Math.abs(b.plan.startStub.x-b.plan.endStub.x)+Math.abs(b.plan.startStub.y-b.plan.endStub.y)));
      const routed=new Array(plans.length);
      order.forEach(({plan,index})=>{
        const {start,end,startStub,endStub}=plan;
        const si=erdNearest(router.xs,startStub.x),sj=erdNearest(router.ys,startStub.y);
        const ti=erdNearest(router.xs,endStub.x),tj=erdNearest(router.ys,endStub.y);
        // cheapest shape first, then progressively more desperate ones
        let middle=erdStraightRoute(router,si,sj,ti,tj,ERD_DETOUR);
        if(!middle&&Date.now()<deadline)middle=erdSolve(router,si,sj,ti,tj);
        if(!middle)middle=erdStraightRoute(router,si,sj,ti,tj,Infinity);
        if(!middle)middle=erdPerimeterRoute(router,si,sj,ti,tj);
        if(middle)erdChargeRoute(router,middle);
        else{
          // nowhere clear at all: a plain Z, which is what the view had before
          const midX=(startStub.x+endStub.x)/2;
          middle=[startStub,{x:midX,y:startStub.y},{x:midX,y:endStub.y},endStub];
        }
        routed[index]=erdSimplify([start,startStub,...middle,endStub,end]);
      });

      // How much of a card the name chip would cover if parked here.
      const covered=(cx,cy,w,h)=>cardRects.reduce((sum,rect)=>sum
        +Math.max(0,Math.min(cx+w/2,rect.right)-Math.max(cx-w/2,rect.left))
        *Math.max(0,Math.min(cy+h/2,rect.bottom)-Math.max(cy-h/2,rect.top)),0);

      const next=plans.map((plan,index)=>{
        const points=routed[index];
        const name=plan.edge.data.source_column||plan.edge.data.label||'';
        const chipW=name.length*5.72+9,chipH=14;
        // Slide the name along every straight run and keep the spot that
        // buries the least card. Free space wins - a gutter, the margin the
        // perimeter routes use - so names stay off the columns underneath.

/* ═════════════════════════════════════════════════════════
   DESIGN MODE — editing the loaded industry model
   ═════════════════════════════════════════════════════════
   A loaded industry model is a starting point, not an answer. Design mode
   lets a data architect sit with the business and cut it down to what the
   organisation actually has: rename entities into the language the room
   uses, drop what is out of scope, add what the industry model never knew
   about, and wire the relationships that result.

   Nothing is edited in place. The parsed model stays pristine as the
   BASELINE, every change is recorded in a separate EDITS overlay, and the
   model on screen is `applyEdits(baseline, edits)`. Three things follow
   from that and they are the reason it is built this way:

     · the change ledger is free — the overlay IS the list of changes, so a
       workshop can always answer "what did we change from the standard?"
     · any change can be reverted to the industry model's version, at any
       time, without an undo trail;
     · what persists is only the delta (a few kB), not a 3 MB model, so a
       browser can keep the work of a full day's workshop.

   Overlay keys are BASELINE keys (`domain.product` as the industry model
   named it), which is what makes a rename survivable: the entry stays put
   while its content moves. */

const EDITS_LS_KEY='dbx-model-edits';

function emptyEdits(){return{v:1,domains:{},products:{},order:[],note:''};}

const NO_EDITS=emptyEdits();

function baseKey(dname,pname){return dname+'.'+pname;}

/* ── Foreign keys, in the overlay's terms ──────────────────────────────
   The model writes a relationship as the string "domain.entity.column". The
   overlay cannot store that verbatim: rename the entity a second time and a
   string captured after the first rename no longer names anything the overlay
   knows about. So a stored key is written against an ANCHOR that never moves —
   the entity's name in the industry model, or "@<overlay key>" for an entity
   the workshop invented — and applyEdits resolves anchors to today's names on
   the way out. `fkAnchor` splits either form; the one-segment "@" anchors are
   why this cannot just be a slice(0,2). */
function fkAnchor(fk){
  const parts=String(fk||'').split('.');
  if(parts[0].charAt(0)==='@') return {a:parts[0],c:parts.slice(1).join('.')};

/* ── Apply the overlay ─────────────────────────────────────
   Rebuilds the model from the baseline every time the overlay changes.

   reused), so this is a shallow relink rather than a deep copy of a
   multi-megabyte model, and it stays fast enough to run on every edit. */
function applyEdits(base,edits){
  if(!base) return base;

    domRename[d.name]=nd.name;

    const ov=dov[k];

  // still name the old path can be re-pointed below.
  const pathMap={}, colMap={};

        if(dom!==d.name) pathMap[from]=baseKey(dom,p.name);

    const ov=pov[k];
    if(ov.status!=='added') return;
    pathMap['@'+k]=baseKey(ov.domain,ov.data.name);

  // lazily: a product nobody renamed keeps the baseline's own array.
  const anyMap=Object.keys(pathMap).length||Object.keys(colMap).length;
  if(anyMap){
    domains.forEach(d=>{
      let dirty=false;
      const prods=(d.products||[]).map(p=>{
        let touched=false;
        const attrs=(p.attributes||[]).map(a=>{
          const fk=(a.foreign_key_to||'').trim();

          const {a:anchor,c:col}=fkAnchor(fk);

/* Today's name for a thing → the anchor the overlay files it under. An editor

  const rev={}, revCol={};

  const dov=edits.domains||{}, pov=edits.products||{}, domRename={};

  const path=parts.slice(0,2).join('.'), col=parts.slice(2).join('.');
