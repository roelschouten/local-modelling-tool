function buildChangeMap(base,edits){
  const cur={},   // current "domain.product" -> {state, key}
        byKey={}; // overlay key -> {state, from, to, name}
  if(!base) return {cur,byKey,counts:{added:0,modified:0,removed:0,domains:0}};
  const dov=edits.domains||{}, pov=edits.products||{};
  const domRename={}, domState={}, domKey={};
  (base.domains||[]).forEach(d=>{
    const ov=dov[d.name];
    if(!ov){domRename[d.name]=d.name;domKey[d.name]=d.name;return;}
    if(ov.status==='deleted'){domState[d.name]='removed';domRename[d.name]=d.name;return;}
    domRename[d.name]=(ov.data&&ov.data.name)||d.name;
    domKey[domRename[d.name]]=d.name;
    domState[d.name]='modified';
  });
  Object.keys(dov).forEach(k=>{
    if(dov[k].status!=='added') return;
    domState[dov[k].data.name]='added'; domKey[dov[k].data.name]=k;
  });

  let added=0,modified=0,removed=0;
  (base.domains||[]).forEach(d=>{
    (d.products||[]).forEach(p=>{
      const key=baseKey(d.name,p.name);
      const ov=pov[key];
      if(!ov){
        const dn=domRename[d.name]||d.name;
        if(dn!==d.name) cur[baseKey(dn,p.name)]={state:'moved',key};
        return;
      }
      if(ov.status==='deleted'){
        removed++;
        byKey[key]={state:'removed',from:key,name:p.name,domain:d.name};
        return;
      }
      modified++;
      const to=baseKey(ov.domain,ov.data.name);
      cur[to]={state:'modified',key};
      byKey[key]={state:'modified',from:key,to,name:ov.data.name,domain:ov.domain,
                  renamed:to!==key};
    });
  });
  Object.keys(pov).forEach(k=>{
    const ov=pov[k];
    if(ov.status!=='added') return;
    added++;
    const to=baseKey(ov.domain,ov.data.name);
    cur[to]={state:'added',key:k};
    byKey[k]={state:'added',to,name:ov.data.name,domain:ov.domain};
  });
  const domains=Object.keys(domState).length;
  return {cur,byKey,domState,domKey,counts:{added,modified,removed,domains,
    total:added+modified+removed+domains}};
}

/* ── Validation ────────────────────────────────────────────
   Runs over the edited model, not the baseline: it is there to catch what a
   workshop breaks, so it only reports what the room can act on. */
function validateModel(model){
  if(!model) return [];
  const issues=[];
  const seenTable={}, pkOf={}, colsOf={};
  const snake=/^[a-z][a-z0-9_]*$/;
  (model.domains||[]).forEach(d=>{
    (d.products||[]).forEach(p=>{
      const id=baseKey(d.name,p.name);
      pkOf[id]=p.primary_key||'';
      colsOf[id]=new Set((p.attributes||[]).map(a=>a.name));
      (seenTable[p.name]=seenTable[p.name]||[]).push(id);
    });
  });
  (model.domains||[]).forEach(d=>{
    const prods=d.products||[];
    if(!prods.length) issues.push({sev:'warn',kind:'domain',target:d.name,
      title:'“'+d.name+'” has no entities',
      body:'An empty domain will produce an empty schema. Add an entity or remove the domain.'});
    if(!snake.test(d.name)) issues.push({sev:'info',kind:'domain',target:d.name,
      title:'“'+d.name+'” is not snake_case',
      body:'The model’s naming convention is snake_case; this name will be carried into the catalog as-is.'});
    prods.forEach(p=>{
      const id=baseKey(d.name,p.name);
      const attrs=p.attributes||[];
      if(!attrs.length) issues.push({sev:'error',kind:'entity',target:id,
        title:p.name+' has no attributes',
        body:'An entity with no columns cannot be deployed.'});
      const pk=(p.primary_key||'').trim();
      if(!pk) issues.push({sev:'warn',kind:'entity',target:id,
        title:p.name+' has no primary key',
        body:'Nothing can reference this entity until one of its columns is the key.'});
      else if(!colsOf[id].has(pk)) issues.push({sev:'error',kind:'entity',target:id,
        title:p.name+'’s primary key is missing',
        body:'The key is set to “'+pk+'”, which is not one of its columns.'});
      if(!snake.test(p.name)) issues.push({sev:'info',kind:'entity',target:id,
        title:p.name+' is not snake_case',
        body:'The model’s naming convention is snake_case.'});
      const dupes={};
      attrs.forEach(a=>{dupes[a.name]=(dupes[a.name]||0)+1;});
      Object.keys(dupes).forEach(n=>{ if(dupes[n]>1) issues.push({sev:'error',kind:'entity',target:id,
        title:'Duplicate column “'+n+'” in '+p.name,
        body:'The column appears '+dupes[n]+' times. Deployment will fail on the second one.'}); });
      attrs.forEach(a=>{
        if(!a.name) issues.push({sev:'error',kind:'entity',target:id,
          title:'Unnamed column in '+p.name,body:'A column with no name cannot be deployed.'});
        if(a.name&&!a.type) issues.push({sev:'warn',kind:'entity',target:id,
          title:'“'+a.name+'” in '+p.name+' has no type',
          body:'Give it a type, or it will land in the catalog as an untyped string.'});
        const fk=(a.foreign_key_to||'').trim();
        if(!fk) return;
        const parts=fk.split('.');
        const tgt=parts.slice(0,2).join('.');
        if(parts.length<2||!colsOf[tgt]) issues.push({sev:'error',kind:'entity',target:id,
          title:'Broken relationship on '+p.name+'.'+a.name,
          body:'It points at “'+fk+'”, which is no longer in the model. Re-point it or clear it.'});
        else if(parts[2]&&!colsOf[tgt].has(parts[2])) issues.push({sev:'warn',kind:'entity',target:id,
          title:'Relationship column missing on '+p.name+'.'+a.name,
          body:'“'+tgt+'” exists but has no column “'+parts[2]+'”.'});
      });
    });
  });
  Object.keys(seenTable).forEach(n=>{
    if(seenTable[n].length>1) issues.push({sev:'info',kind:'entity',target:seenTable[n][0],
      title:'“'+n+'” is used in '+seenTable[n].length+' domains',
      body:seenTable[n].join(', ')+'. Legal, but two tables with one name confuse a glossary.'});
  });
  const rank={error:0,warn:1,info:2};
  return issues.sort((a,b)=>rank[a.sev]-rank[b.sev]);
}

/* ── Exports ───────────────────────────────────────────────
   The JSON round-trips: it goes back out in the wrapper it arrived in, so
   the installer and the agent can read what the workshop produced. */
function downloadText(filename,text,mime){
  try{
    const blob=new Blob([text],{type:mime||'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){ alert('Could not start the download: '+e.message); }
}
function exportModelJson(wrapper,model,edits,label){
  const stamp=new Date().toISOString();
  const body=wrapper&&wrapper.model
    ? {...wrapper,model,
       _design_session:{edited_at:stamp,edited_in:'Model Viewer design mode',
                        changes:buildChangeMap(wrapper.model,edits).counts,
                        note:(edits&&edits.note)||''}}
    : model;
  downloadText(safeName(label)+'_edited.json',JSON.stringify(body,null,2),'application/json');
}
function safeName(s){return String(s||'model').replace(/[^\w.-]+/g,'_').replace(/^_+|_+$/g,'')||'model';}
function sqlType(t){return (t||'STRING').trim()||'STRING';}
function exportDDL(model,label,catalog){
  const cat=catalog||safeName(label).toLowerCase();
  const out=['-- '+(model.name||label)+' — generated from Model Viewer design mode',
             '-- '+new Date().toISOString(),''];
  (model.domains||[]).forEach(d=>{
    out.push('-- ══ '+d.name.toUpperCase()+' ══');
    out.push('CREATE SCHEMA IF NOT EXISTS `'+cat+'`.`'+(d.database_name||d.name)+'`;','');
    (d.products||[]).forEach(p=>{
      const tbl='`'+cat+'`.`'+(d.database_name||d.name)+'`.`'+(p.table_name||p.name)+'`';
      out.push('CREATE TABLE IF NOT EXISTS '+tbl+' (');
      const cols=(p.attributes||[]).map(a=>{
        const c='  `'+a.name+'` '+sqlType(a.type);
        const cm=(a.description||'').replace(/'/g,"''").slice(0,900);
        return c+(cm?" COMMENT '"+cm+"'":'');
      });
      if(p.primary_key) cols.push('  CONSTRAINT `pk_'+(p.table_name||p.name)+'` PRIMARY KEY (`'+p.primary_key+'`)');
      out.push(cols.join(',\n'));
      const cmt=(p.description||'').replace(/'/g,"''").slice(0,900);
      out.push(')'+(cmt?"\nCOMMENT '"+cmt+"'":'')+';','');
    });
  });
  out.push('-- ══ RELATIONSHIPS ══');
  (model.domains||[]).forEach(d=>{
    (d.products||[]).forEach(p=>{
      (p.attributes||[]).forEach(a=>{
        const fk=(a.foreign_key_to||'').trim();
        if(!fk) return;
        const parts=fk.split('.');
        if(parts.length<2) return;
        const tgtDom=(model.domains||[]).find(x=>x.name===parts[0]);
        if(!tgtDom) return;
        const tgtProd=(tgtDom.products||[]).find(x=>x.name===parts[1]);
        if(!tgtProd) return;
        out.push('ALTER TABLE `'+cat+'`.`'+(d.database_name||d.name)+'`.`'+(p.table_name||p.name)+'` '+
          'ADD CONSTRAINT `fk_'+(p.table_name||p.name)+'_'+a.name+'` FOREIGN KEY (`'+a.name+'`) '+
          'REFERENCES `'+cat+'`.`'+(tgtDom.database_name||tgtDom.name)+'`.`'+(tgtProd.table_name||tgtProd.name)+
          '` (`'+(parts[2]||tgtProd.primary_key||'id')+'`);');
      });
    });
  });
  downloadText(safeName(label)+'.sql',out.join('\n'),'text/plain;charset=utf-8');
}
function exportDBML(model,label){
  const out=['// '+(model.name||label)+' — generated from Model Viewer design mode',''];
  const refs=[];
  (model.domains||[]).forEach(d=>{
    (d.products||[]).forEach(p=>{
      out.push('Table '+d.name+'.'+p.name+' {');
      (p.attributes||[]).forEach(a=>{
        const notes=[];
        if(a.name===p.primary_key) notes.push('pk');
        const nt=(a.description||'').replace(/["\n]/g,' ').slice(0,120);
        if(nt) notes.push('note: "'+nt+'"');
        out.push('  '+a.name+' '+(a.type||'string').replace(/[ ,]/g,'')+
          (notes.length?' ['+notes.join(', ')+']':''));
        const fk=(a.foreign_key_to||'').trim();
        if(fk){
          const parts=fk.split('.');
          if(parts.length>=2) refs.push('Ref: '+d.name+'.'+p.name+'.'+a.name+' > '+
            parts[0]+'.'+parts[1]+'.'+(parts[2]||'id'));
        }
      });
      const note=(p.description||'').replace(/["\n']/g,' ').slice(0,300);
      if(note) out.push("  Note: '"+note+"'");
      out.push('}','');
    });
  });
  out.push('',...refs);
  downloadText(safeName(label)+'.dbml.txt',out.join('\n'),'text/plain;charset=utf-8');
}
function csvCell(v){const s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportDictionary(model,label){
  const rows=[['domain','entity','entity_type','subdomain','column','data_type','primary_key',
               'foreign_key_to','business_term','description','tags']];
  (model.domains||[]).forEach(d=>(d.products||[]).forEach(p=>(p.attributes||[]).forEach(a=>{
    rows.push([d.name,p.name,p.type||'',p.subdomain||'',a.name,a.type||'',
      a.name===p.primary_key?'Y':'',a.foreign_key_to||'',a.business_glossary_term||'',
      a.description||'',Array.isArray(a.tags)?a.tags.join(' '):(a.tags||'')]);
  })));
  downloadText(safeName(label)+'_dictionary.csv',
    rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv;charset=utf-8');
}
function exportChangeReport(base,model,edits,label){
  const cm=buildChangeMap(base,edits);
  const L=['# Model changes — '+(model.name||label),'',
    'Baseline: the industry model as shipped. Generated '+new Date().toISOString().slice(0,16).replace('T',' ')+'.','',
    '| | count |','|---|---|',
    '| Entities added | '+cm.counts.added+' |',
    '| Entities changed | '+cm.counts.modified+' |',
    '| Entities removed | '+cm.counts.removed+' |',
    '| Domains touched | '+cm.counts.domains+' |',''];
  if((edits.note||'').trim()) L.push('## Workshop note','',edits.note.trim(),'');
  const idx=baseIndex(base);
  const dstate=cm.domState||{};
  if(Object.keys(dstate).length){
    L.push('## Domains','');
    Object.keys(dstate).sort().forEach(n=>{
      const ov=(edits.domains||{})[n];
      const now=ov&&ov.data&&ov.data.name;
      L.push('- **'+n+'** — '+dstate[n]+(now&&now!==n?' · now `'+now+'`':''));
    });
    L.push('');
  }
  const groups={added:[],modified:[],removed:[]};
  Object.keys(cm.byKey).forEach(k=>{const c=cm.byKey[k];groups[c.state].push({k,c});});
  const heads={added:'Entities added',modified:'Entities changed',removed:'Entities removed'};
  ['added','modified','removed'].forEach(state=>{
    const list=groups[state];
    if(!list.length) return;
    L.push('## '+heads[state],'');
    list.sort((a,b)=>(a.c.to||a.c.from).localeCompare(b.c.to||b.c.from)).forEach(({k,c})=>{
      if(state==='removed'){L.push('- `'+c.from+'`');return;}
      if(state==='added'){
        const ov=edits.products[k];
        const nc=(ov.data.attributes||[]).length;
        L.push('- `'+c.to+'` — '+nc+' column'+(nc===1?'':'s')+
          (ov.data.description?' · '+ov.data.description.slice(0,140):''));
        return;
      }
      const before=(idx.products[k]||{}).product||{};
      const after=(edits.products[k]||{}).data||{};
      const bits=[];
      if(c.renamed) bits.push('renamed from `'+c.from+'`');
      const ba=(before.attributes||[]).map(a=>a.name), aa=(after.attributes||[]).map(a=>a.name);
      const gone=ba.filter(n=>aa.indexOf(n)<0), nu=aa.filter(n=>ba.indexOf(n)<0);
      if(nu.length) bits.push('+'+nu.length+' column'+(nu.length===1?'':'s')+' ('+nu.slice(0,8).join(', ')+(nu.length>8?'…':'')+')');
      if(gone.length) bits.push('−'+gone.length+' column'+(gone.length===1?'':'s')+' ('+gone.slice(0,8).join(', ')+(gone.length>8?'…':'')+')');
      if((before.description||'')!==(after.description||'')) bits.push('description rewritten');
      if((before.primary_key||'')!==(after.primary_key||'')) bits.push('primary key → `'+after.primary_key+'`');
      if((before.subdomain||'')!==(after.subdomain||'')) bits.push('subdomain → '+(after.subdomain||'—'));
      const note=(after.data_modeler_notes||'').trim();
      L.push('- `'+c.to+'`'+(bits.length?' — '+bits.join('; '):' — edited'));
      if(note) L.push('  - note: '+note.replace(/\n+/g,' '));
    });
    L.push('');
  });
  downloadText(safeName(label)+'_changes.md',L.join('\n'),'text/markdown;charset=utf-8');
}

/* Free-text columns pasted out of whatever the room brought with them — a
   CREATE TABLE, a spreadsheet column, the text of an ARIS screenshot someone
   retyped. Anything it cannot read it drops rather than guessing. */
function parsePastedColumns(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(raw=>{
    let line=raw.trim().replace(/,$/,'');
    if(!line) return;
    if(/^(create|--|\/\/|#|\)|\(|primary key|foreign key|constraint|using|comment|partitioned|tblproperties)/i.test(line)) return;
    line=line.replace(/^[`"[]|[`"\]]$/g,'');
    let name='',type='',desc='';
    // A comma inside DECIMAL(18,2) or MAP<a,b> is part of the type, not a cell
    // boundary, so the split only fires at bracket depth zero.
    const cells=[]; let cell='', depth=0;
    for(const ch of line){
      if('(<['.includes(ch)) depth++;
      else if(')>]'.includes(ch)) depth=Math.max(0,depth-1);
      if(depth===0&&',;\t|'.includes(ch)){cells.push(cell);cell='';continue;}
      cell+=ch;
    }
    cells.push(cell);
    if(cells.length>1){
      const c=cells.map(x=>x.trim());
      name=c[0]; type=c[1]||''; desc=c.slice(2).filter(Boolean).join(' ');
    }else{
      const parts=line.split(/\s+/);
      name=parts[0]; type=parts[1]||''; desc=parts.slice(2).join(' ');
    }
    name=(name||'').replace(/[`"'[\]]/g,'').trim();
    if(!name||/\s/.test(name)) return;
    type=(type||'').replace(/[`"']/g,'').replace(/,$/,'').trim();
    if(type&&!/^[A-Za-z][\w<>(),. ]*$/.test(type)){desc=(type+' '+desc).trim();type='';}
    out.push({name:name.toLowerCase(),type:(type||'STRING').toUpperCase(),desc:desc.trim()});
  });
  return out;
}

/* A blank entity carries the model's own conventions rather than a generic
   `id`: a new table should look like it belongs to the model it joins. */
function blankProduct(name,conv){
  const suffix=(conv&&conv.primary_key_suffix)||'_id';
  const idType=(conv&&conv.table_id_type)||'BIGINT';
  const pk=name+suffix;
  return {name,table_name:name,primary_key:pk,subdomain:'',
    description:'',type:'Master',division:'',function:'',data_type:'master_data',
    source_domains:'',association_edges:'',reference:'',tags:'',
    attributes:[{name:pk,column_name:pk,type:idType,business_glossary_term:'',
      description:'Unique identifier. Primary key.',value_regex:'',tags:'primary_key',
      foreign_key_to:'',references:''}]};
}
function blankDomain(name){
  return {name,division:'operations',description:'',database_name:name,
          references:'',tags:'',products:[]};
}
/* The editor works on rows with a stable id so a rename can be told apart
   from a delete-and-add; the id never reaches the model. */
function toRows(attrs){
  return (attrs||[]).map(a=>({_id:newAid(),_from:a.name,name:a.name||'',type:a.type||'',
    description:a.description||'',foreign_key_to:a.foreign_key_to||'',
    business_glossary_term:a.business_glossary_term||'',
    tags:Array.isArray(a.tags)?a.tags.join(', '):(a.tags||''),
    value_regex:a.value_regex||'',references:a.references||''}));
}
function fromRows(rows){
  return rows.filter(r=>(r.name||'').trim()).map(r=>({
    name:r.name.trim(),column_name:r.name.trim(),type:(r.type||'STRING').trim(),
    business_glossary_term:r.business_glossary_term||'',description:r.description||'',
    value_regex:r.value_regex||'',tags:r.tags||'',
    foreign_key_to:(r.foreign_key_to||'').trim(),references:r.references||''}));
}
function rowRenames(rows){
  const ren={};
  rows.forEach(r=>{ if(r._from&&r.name&&r._from!==r.name.trim()) ren[r._from]=r.name.trim(); });
  return ren;
}
/* Every entity in the model, flattened once, for the pickers. */
function entityList(model){
  const out=[];
  (model&&model.domains||[]).forEach(d=>(d.products||[]).forEach(p=>{
    out.push({id:baseKey(d.name,p.name),domain:d.name,name:p.name,
      pk:p.primary_key||'',count:(p.attributes||[]).length,desc:p.description||''});
  }));
  return out;
}

/* ── Dialog shell ──────────────────────────────────────────
   One shell for every editor, so Escape, the scrim click and the focus trap
   are written once. */
function Dlg({title,sub,icon,size,onClose,foot,children,wide}){
  useEffect(()=>{
    const onKey=e=>{ if(e.key==='Escape'){e.stopPropagation();onClose();} };
    window.addEventListener('keydown',onKey,true);
    return ()=>window.removeEventListener('keydown',onKey,true);
  },[onClose]);
  return h('div',{className:'dlg-scrim',onMouseDown:e=>{if(e.target===e.currentTarget)onClose();}},
    h('div',{className:'dlg'+(size?' '+size:''),role:'dialog','aria-modal':'true','aria-label':title,
             onMouseDown:e=>e.stopPropagation()},
      h('div',{className:'dlg-head'},
        icon&&h('span',{style:{fontSize:15}},icon),
        h('div',{style:{minWidth:0}},
          h('h3',null,title),
          sub&&h('div',{className:'sub'},sub)),
        h('button',{className:'dlg-x',onClick:onClose,title:'Close (Esc)','aria-label':'Close'},'✕')
      ),
      h('div',{className:'dlg-body'},children),
      foot&&h('div',{className:'dlg-foot'},foot)
    )
  );
}
function Fld({label,hint,style,children}){
  return h('div',{className:'fld',style},
    label&&h('label',null,label),
    children,
    hint&&h('div',{className:'hint'},hint));
}

/* ── Entity picker ─────────────────────────────────────────
   Used wherever a relationship needs a target. 262 entities do not browse
   by scrolling, so it is a search box first and a list second. */
function EntityPicker({model,graphData,title,note,onPick,onClose,exclude}){
  const [q,setQ]=useState('');
  const [cursor,setCursor]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{inputRef.current&&inputRef.current.focus();},[]);
  const all=useMemo(()=>entityList(model),[model]);
  const list=useMemo(()=>{
    const s=q.trim().toLowerCase();
    const pool=all.filter(e=>e.id!==exclude);
    if(!s) return pool.slice(0,300);
    return pool.filter(e=>e.id.toLowerCase().includes(s)||
      (e.desc||'').toLowerCase().includes(s)).slice(0,300);
  },[all,q,exclude]);
  useEffect(()=>{setCursor(0);},[q]);
  const colors=(graphData&&graphData.domainColors)||{};
  const onKey=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();setCursor(c=>Math.min(list.length-1,c+1));}
    else if(e.key==='ArrowUp'){e.preventDefault();setCursor(c=>Math.max(0,c-1));}
    else if(e.key==='Enter'){e.preventDefault();if(list[cursor])onPick(list[cursor]);}
  };
  return h(Dlg,{title:title||'Choose an entity',sub:note,icon:'⌕',size:'md',onClose},
    h('input',{ref:inputRef,type:'search',value:q,placeholder:'Search entities…',
      onChange:e=>setQ(e.target.value),onKeyDown:onKey,style:{marginBottom:8}}),
    h('div',{style:{maxHeight:'52vh',overflowY:'auto'}},
      !list.length&&h('p',{style:{color:'var(--muted)',fontSize:12,padding:'14px 4px'}},
        'Nothing matches “'+q+'”.'),
      list.map((e,i)=>h('button',{key:e.id,className:'pick-row'+(i===cursor?' cursor':''),
          onMouseEnter:()=>setCursor(i),onClick:()=>onPick(e)},
        h('span',{className:'pick-dom',style:{background:colors[e.domain]||'var(--muted)'}}),
        h('span',{style:{minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
          h('b',{style:{fontWeight:650}},e.name),
          h('span',{style:{color:'var(--faint)',fontSize:11}},'  '+e.domain)),
        h('span',{className:'pk'},e.pk||'no key')
      ))
    )
  );
}

/* ── Paste columns ─────────────────────────────────────────
   The bridge from the world people arrive with: a CREATE TABLE, a column of
   a spreadsheet, a list retyped off an ARIS diagram. It parses, shows what it
   read, and adds nothing until that preview looks right. */
function PasteColumnsDialog({onAdd,onClose}){
  const [text,setText]=useState('');
  const parsed=useMemo(()=>parsePastedColumns(text),[text]);
  return h(Dlg,{title:'Paste columns',icon:'⎘',size:'md',onClose,
      sub:'A CREATE TABLE, a CSV, or one column per line',
      foot:h(React.Fragment,null,
        h('span',{style:{fontSize:11,color:'var(--muted)'}},
          parsed.length?parsed.length+' column'+(parsed.length===1?'':'s')+' recognised':'Nothing recognised yet'),
        h('span',{className:'spacer'}),
        h('button',{className:'btn',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-accent',disabled:!parsed.length,
          onClick:()=>{onAdd(parsed);onClose();}},'Add '+(parsed.length||'')+' columns'))},
    h('textarea',{className:'mono',value:text,autoFocus:true,
      placeholder:'customer_id  BIGINT  Unique customer key\ncustomer_name  STRING\nsigned_on  DATE',
      onChange:e=>setText(e.target.value),style:{minHeight:150,marginBottom:10}}),
    parsed.length>0&&h('div',{style:{border:'1px solid var(--line)',borderRadius:8,
        maxHeight:'26vh',overflowY:'auto'}},
      parsed.map((p,i)=>h('div',{key:i,style:{display:'grid',
          gridTemplateColumns:'minmax(0,1fr) 120px minmax(0,1.4fr)',gap:8,padding:'5px 9px',
          borderBottom:'1px solid var(--veil)',fontSize:11}},
        h('span',{style:{fontFamily:'ui-monospace,monospace',color:'var(--ink)'}},p.name),
        h('span',{style:{color:'var(--g-amber-line)',fontFamily:'ui-monospace,monospace'}},p.type),
        h('span',{style:{color:'var(--muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.desc)
      ))
    )
  );
}

/* ── Entity editor ─────────────────────────────────────────
   The one screen a modeller lives in during a workshop: the entity's
   business identity above, its columns below in a grid that behaves like the
   spreadsheet everyone in the room already knows. It edits a WORKING COPY —
   nothing reaches the model until Save, so a conversation that goes nowhere
   costs nothing. */
function EntityEditor({model,graphData,conv,entry,changeState,onSave,onDelete,onRevert,onClose}){
  const base=entry.product;
  const [name,setName]=useState(base.name||'');
  const [domain,setDomain]=useState(entry.domain);
  const [subdomain,setSubdomain]=useState(base.subdomain||'');
  const [ptype,setPtype]=useState(base.type||'Master');
  const [dataType,setDataType]=useState(base.data_type||'');
  const [desc,setDesc]=useState(base.description||'');
  const [tags,setTags]=useState(Array.isArray(base.tags)?base.tags.join(', '):(base.tags||''));
  const [reference,setReference]=useState(base.reference||'');
  const [note,setNote]=useState(base.data_modeler_notes||'');
  const [pk,setPk]=useState(base.primary_key||'');
  const [rows,setRows]=useState(()=>toRows(base.attributes));
  const [filter,setFilter]=useState('');
  const [pickFor,setPickFor]=useState(null);   // row id awaiting an FK target
  const [pasting,setPasting]=useState(false);
  const [showMeta,setShowMeta]=useState(false);
  const bodyRef=useRef(null);

  const domains=useMemo(()=>(model.domains||[]).map(d=>d.name),[model]);
  const subs=useMemo(()=>{
    const d=(model.domains||[]).find(x=>x.name===domain);
    const set=new Set((d&&d.products||[]).map(p=>p.subdomain).filter(Boolean));
    return [...set].sort();
  },[model,domain]);

  const setRow=(id,patch)=>setRows(rs=>rs.map(r=>r._id===id?{...r,...patch}:r));
  const move=(id,dir)=>setRows(rs=>{
    const i=rs.findIndex(r=>r._id===id), j=i+dir;
    if(i<0||j<0||j>=rs.length) return rs;
    const next=rs.slice(); const t=next[i]; next[i]=next[j]; next[j]=t; return next;
  });
  const addRow=()=>{
    const id=newAid();
    setRows(rs=>[...rs,{_id:id,_from:'',name:'',type:'STRING',description:'',
      foreign_key_to:'',business_glossary_term:'',tags:'',value_regex:'',references:''}]);
    setFilter('');
    setTimeout(()=>{
      const el=document.querySelector('[data-row="'+id+'"] input');
      if(el){el.focus();el.scrollIntoView({block:'nearest'});}
    },30);
  };
  const delRow=id=>setRows(rs=>rs.filter(r=>r._id!==id));

  const shown=useMemo(()=>{
    const s=filter.trim().toLowerCase();
    return s?rows.filter(r=>(r.name||'').toLowerCase().includes(s)||
      (r.description||'').toLowerCase().includes(s)):rows;
  },[rows,filter]);

  const nameOk=/^\S+$/.test(name.trim());
  const dupNames=useMemo(()=>{
    const seen={},dup=new Set();
    rows.forEach(r=>{const n=(r.name||'').trim();if(!n)return;if(seen[n])dup.add(n);seen[n]=1;});
    return dup;
  },[rows]);
  const clash=useMemo(()=>{
    const target=baseKey(domain,name.trim());
    if(target===baseKey(entry.domain,base.name)) return false;
    return entityList(model).some(e=>e.id===target);
  },[model,domain,name,entry.domain,base.name]);

  const commit=()=>{
    if(!nameOk||clash) return;
    const attrs=fromRows(rows);
    const product={...base,name:name.trim(),
      table_name:(base.table_name===base.name||!base.table_name)?name.trim():base.table_name,
      primary_key:pk,subdomain,type:ptype,data_type:dataType,description:desc,
      tags,reference,attributes:attrs};
    if(note.trim()) product.data_modeler_notes=note.trim(); else delete product.data_modeler_notes;
    onSave({product,domain,ren:rowRenames(rows)});
  };
  useEffect(()=>{
    const onKey=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();commit();} };
    window.addEventListener('keydown',onKey);
    return ()=>window.removeEventListener('keydown',onKey);
  });

  const pkOfTarget=id=>{const e=entityList(model).find(x=>x.id===id);return e?e.pk:'';};
  const stateChip=changeState&&h('span',{className:'chip-mini '+
      (changeState==='added'?'chip-add':'chip-mod')},
    changeState==='added'?'NEW':'CHANGED');

  return h(React.Fragment,null,
    h(Dlg,{title:entry.isNew?'New entity':(base.name||'Entity'),
      icon:'▦',onClose,
      sub:h('span',null,domain.replace(/_/g,' '),subdomain?' › '+subdomain.replace(/_/g,' '):'',
        '  ·  ',rows.length+' columns',stateChip?'  ':'' ,stateChip),
      foot:h(React.Fragment,null,
        !entry.isNew&&h('button',{className:'btn',style:{color:'var(--danger)'},
          title:'Take this entity out of the model',
          onClick:()=>{ if(confirm('Remove “'+base.name+'” from the model?\n\nIt stays in the change list and can be restored at any time.')){onDelete();} }},
          '✕ Remove entity'),
        !entry.isNew&&changeState==='modified'&&h('button',{className:'btn',
          title:'Throw away every change to this entity and take the industry model’s version back',
          onClick:()=>{ if(confirm('Restore “'+base.name+'” to the industry model’s version?')){onRevert();} }},
          '↺ Restore original'),
        h('span',{className:'spacer'}),
        clash&&h('span',{style:{fontSize:11,color:'var(--danger)'}},'An entity called that is already in '+domain),
        dupNames.size>0&&h('span',{style:{fontSize:11,color:'var(--danger)'}},
          'Duplicate column: '+[...dupNames].join(', ')),
        h('button',{className:'btn',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-accent',disabled:!nameOk||clash,onClick:commit},
          entry.isNew?'Add entity':'Save changes'))},

      h('div',{ref:bodyRef},
        h('div',{className:'fldrow',style:{gridTemplateColumns:'1.4fr 1fr 1fr 1fr'}},
          h(Fld,{label:'Entity name',hint:'snake_case — this becomes the table name'},
            h('input',{type:'text',value:name,autoFocus:true,className:'mono'+(nameOk?'':' req-bad'),
              onChange:e=>setName(e.target.value.replace(/\s+/g,'_'))})),
          h(Fld,{label:'Domain'},
            h('select',{value:domain,onChange:e=>setDomain(e.target.value)},
              domains.map(d=>h('option',{key:d,value:d},d)))),
          h(Fld,{label:'Subdomain',hint:'groups entities inside the domain'},
            h('input',{type:'text',value:subdomain,list:'mv-subs',
              onChange:e=>setSubdomain(e.target.value)}),
            h('datalist',{id:'mv-subs'},subs.map(s=>h('option',{key:s,value:s})))),
          h(Fld,{label:'Entity type'},
            h('select',{value:ptype,onChange:e=>setPtype(e.target.value)},
              [...new Set([ptype,...PRODUCT_TYPES].filter(Boolean))].map(t=>h('option',{key:t,value:t},t))))
        ),
        h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr'}},
          h(Fld,{label:'What this entity is',hint:'Written for the business, not for the warehouse — this is what the room reads back'},
            h('textarea',{value:desc,onChange:e=>setDesc(e.target.value),
              style:{minHeight:74},placeholder:'The authoritative record for…'}))
        ),
        h('div',{style:{marginBottom:11}},
          h('button',{className:'tbtn',onClick:()=>setShowMeta(m=>!m)},
            (showMeta?'▾':'▸')+' Workshop notes, tags and provenance'),
          showMeta&&h('div',{style:{marginTop:9}},
            h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr'}},
              h(Fld,{label:'Workshop note',hint:'Why this entity looks the way it does — decisions, owners, open questions'},
                h('textarea',{value:note,onChange:e=>setNote(e.target.value),
                  placeholder:'Agreed with Finance 3 Sep: one row per contract, not per invoice line.'}))),
            h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr 1fr 1fr'}},
              h(Fld,{label:'Tags'},h('input',{type:'text',value:tags,
                onChange:e=>setTags(e.target.value),placeholder:'pii, gold'})),
              h(Fld,{label:'Data type'},h('input',{type:'text',value:dataType,list:'mv-dtypes',
                onChange:e=>setDataType(e.target.value)}),
                h('datalist',{id:'mv-dtypes'},DATA_TYPES.map(t=>h('option',{key:t,value:t})))),
              h(Fld,{label:'Reference'},h('input',{type:'text',value:reference,
                onChange:e=>setReference(e.target.value),placeholder:'OAGIS 10.9 · ARIS LDM'}))))
        ),

        h('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:7}},
          h('span',{className:'section-header',style:{margin:0}},'Columns'),
          h('span',{style:{fontSize:10,color:'var(--faint)'}},
            rows.length+' total'+(filter?' · '+shown.length+' shown':'')),
          h('span',{style:{flex:1}}),
          h('input',{type:'search',value:filter,placeholder:'Filter columns…',
            onChange:e=>setFilter(e.target.value),style:{width:170,padding:'5px 8px',fontSize:11}}),
          h('button',{className:'tbtn',onClick:()=>setPasting(true),
            title:'Paste a CREATE TABLE, a CSV or a plain list'},'⎘ Paste'),
          h('button',{className:'tbtn',onClick:addRow},'+ Column')
        ),
        h('datalist',{id:'mv-types'},COMMON_TYPES.map(t=>h('option',{key:t,value:t}))),
        h('div',{className:'colgrid'},
          h('div',{className:'colgrid-head'},
            h('div',null,'#'),h('div',null,'Column'),h('div',null,'Type'),
            h('div',{title:'Primary key'},'PK'),h('div',null,'References'),
            h('div',null,'Description'),h('div',null,'')),
          h('div',{className:'colgrid-body'},
            !shown.length&&h('div',{style:{padding:'22px 12px',textAlign:'center',
              color:'var(--muted)',fontSize:12}},
              rows.length?'No column matches that filter.':'No columns yet — add one, or paste a list.'),
            shown.map(r=>{
              const i=rows.indexOf(r);
              const isPk=pk&&r.name===pk;
              const fk=(r.foreign_key_to||'').trim();
              return h('div',{key:r._id,'data-row':r._id,
                  className:'colgrid-row'+(isPk?' is-pk':'')},
                h('div',{className:'idx'},i+1),
                h('div',null,h('input',{type:'text',className:'mono'+(dupNames.has(r.name)?' req-bad':''),
                  value:r.name,placeholder:'column_name',
                  onChange:e=>{
                    const nu=e.target.value.replace(/\s+/g,'_');
                    if(isPk) setPk(nu);
                    setRow(r._id,{name:nu});
                  }})),
                h('div',null,h('input',{type:'text',className:'mono',value:r.type,list:'mv-types',
                  placeholder:'STRING',onChange:e=>setRow(r._id,{type:e.target.value})})),
                h('div',{style:{textAlign:'center'}},
                  h('input',{type:'checkbox',checked:!!isPk,
                    title:isPk?'This is the primary key':'Make this the primary key',
                    onChange:()=>setPk(isPk?'':r.name)})),
                h('div',null,h('div',{className:'fk-cell'},
                  h('button',{className:'fk-btn'+(fk?'':' empty'),
                    title:fk?'Points at '+fk+' — click to re-point':'Point this column at another entity',
                    onClick:()=>setPickFor(r._id)},fk||'—'),
                  fk&&h('button',{className:'rowbtn',title:'Clear the relationship',
                    onClick:()=>setRow(r._id,{foreign_key_to:''})},'✕'))),
                h('div',null,h('input',{type:'text',value:r.description,placeholder:'What it holds',
                  onChange:e=>setRow(r._id,{description:e.target.value})})),
                h('div',{className:'rowbtns'},
                  h('button',{className:'rowbtn',title:'Move up',disabled:!!filter||i===0,
                    onClick:()=>move(r._id,-1)},'↑'),
                  h('button',{className:'rowbtn',title:'Move down',disabled:!!filter||i===rows.length-1,
                    onClick:()=>move(r._id,1)},'↓'),
                  h('button',{className:'rowbtn danger',title:'Delete this column',
                    onClick:()=>delRow(r._id)},'✕'))
              );
            })
          )
        )
      )
    ),
    pickFor&&h(EntityPicker,{model,graphData,title:'Point the column at…',
      note:'The column becomes a foreign key to that entity’s primary key',
      exclude:baseKey(domain,name),
      onClose:()=>setPickFor(null),
      onPick:e=>{
        const target=e.pk?e.id+'.'+e.pk:e.id;
        setRow(pickFor,{foreign_key_to:target,
          type:rows.find(r=>r._id===pickFor).type||'BIGINT'});
        setPickFor(null);
      }}),
    pasting&&h(PasteColumnsDialog,{onClose:()=>setPasting(false),
      onAdd:cols=>setRows(rs=>[...rs,...cols.map(c=>({_id:newAid(),_from:'',name:c.name,
        type:c.type,description:c.desc,foreign_key_to:'',business_glossary_term:'',
        tags:'',value_regex:'',references:''}))])})
  );
}

/* ── Domain editor ─────────────────────────────────────────
   A domain is a business capability before it is a schema, so this is mostly
   words. Its entity list is here because moving one entity to another domain
   is the single most common thing a workshop does to a domain. */
function DomainEditor({model,entry,changeState,onSave,onDelete,onRevert,onClose,onOpenEntity}){
  const base=entry.domain;
  const [name,setName]=useState(base.name||'');
  const [division,setDivision]=useState(base.division||'');
  const [desc,setDesc]=useState(base.description||'');
  const [dbName,setDbName]=useState(base.database_name||base.name||'');
  const [references,setReferences]=useState(base.references||'');
  const [tags,setTags]=useState(Array.isArray(base.tags)?base.tags.join(', '):(base.tags||''));
  const prods=base.products||[];
  const nameOk=/^\S+$/.test(name.trim());
  const clash=useMemo(()=>name.trim()!==base.name&&
    (model.domains||[]).some(d=>d.name===name.trim()),[model,name,base.name]);
  const commit=()=>{
    if(!nameOk||clash) return;
    onSave({name:name.trim(),division,description:desc,
      database_name:dbName.trim()||name.trim(),references,tags});
  };
  return h(Dlg,{title:entry.isNew?'New domain':(base.name||'Domain'),icon:'◰',size:'md',onClose,
    sub:entry.isNew?'A business capability of the organisation'
      :prods.length+' entities'+(changeState?' · '+changeState:''),
    foot:h(React.Fragment,null,
      !entry.isNew&&h('button',{className:'btn',style:{color:'var(--danger)'},
        onClick:()=>{ if(confirm('Remove the domain “'+base.name+'” and its '+prods.length+
          ' entities from the model?\n\nIt stays in the change list and can be restored.')) onDelete(); }},
        '✕ Remove domain'),
      !entry.isNew&&changeState&&h('button',{className:'btn',
        onClick:()=>{if(confirm('Restore “'+base.name+'” to the industry model’s version?'))onRevert();}},
        '↺ Restore original'),
      h('span',{className:'spacer'}),
      clash&&h('span',{style:{fontSize:11,color:'var(--danger)'}},'That domain name is taken'),
      h('button',{className:'btn',onClick:onClose},'Cancel'),
      h('button',{className:'btn btn-accent',disabled:!nameOk||clash,onClick:commit},
        entry.isNew?'Add domain':'Save changes'))},
    h('div',{className:'fldrow',style:{gridTemplateColumns:'1.3fr 1fr 1fr'}},
      h(Fld,{label:'Domain name',hint:'snake_case — becomes the schema'},
        h('input',{type:'text',className:'mono'+(nameOk?'':' req-bad'),value:name,autoFocus:true,
          onChange:e=>{const v=e.target.value.replace(/\s+/g,'_');
            if(dbName===name)setDbName(v); setName(v);}})),
      h(Fld,{label:'Division'},
        h('select',{value:division,onChange:e=>setDivision(e.target.value)},
          h('option',{value:''},'—'),
          [...new Set([division,...DIVISIONS].filter(Boolean))].map(d=>h('option',{key:d,value:d},d)))),
      h(Fld,{label:'Schema name'},
        h('input',{type:'text',className:'mono',value:dbName,onChange:e=>setDbName(e.target.value)}))),
    h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr'}},
      h(Fld,{label:'What this domain covers'},
        h('textarea',{value:desc,onChange:e=>setDesc(e.target.value),
          placeholder:'Everything the business does around…'}))),
    h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr 1fr'}},
      h(Fld,{label:'Standards it follows'},h('input',{type:'text',value:references,
        onChange:e=>setReferences(e.target.value),placeholder:'OAGIS · ISO 20022'})),
      h(Fld,{label:'Tags'},h('input',{type:'text',value:tags,onChange:e=>setTags(e.target.value)}))),
    !entry.isNew&&prods.length>0&&h('div',null,
      h('div',{className:'section-header'},'Entities'),
      h('div',{style:{maxHeight:'26vh',overflowY:'auto',border:'1px solid var(--line)',
                      borderRadius:8,padding:5}},
        prods.map(p=>h('button',{key:p.name,className:'pick-row',
            onClick:()=>{onOpenEntity(baseKey(base.name,p.name));},
            title:'Open '+p.name},
          h('span',{style:{fontFamily:'ui-monospace,monospace',fontSize:11.5}},p.name),
          h('span',{className:'pk'},(p.attributes||[]).length+' cols')))))
  );
}

/* ── New relationship ──────────────────────────────────────
   In the model a relationship IS a column, so this dialog writes one: it adds
   the foreign key column to the child, defaulting its name and type from the
   parent's key so the common case is three clicks. */
function RelationshipDialog({model,graphData,initial,onSave,onClose}){
  const [child,setChild]=useState((initial&&initial.child)||null);
  const [parent,setParent]=useState((initial&&initial.parent)||null);
  const [col,setCol]=useState('');
  const [desc,setDesc]=useState('');
  const [picking,setPicking]=useState(null);
  const [touched,setTouched]=useState(false);
  const list=useMemo(()=>entityList(model),[model]);
  const find=id=>list.find(e=>e.id===id);
  const pe=parent?find(parent):null, ce=child?find(child):null;
  useEffect(()=>{
    if(!touched&&pe) setCol(pe.pk||pe.name+'_id');
  },[pe,touched]);
  const childProduct=useMemo(()=>{
    if(!child) return null;
    const [dn,pn]=child.split('.');
    const d=(model.domains||[]).find(x=>x.name===dn);
    return d&&(d.products||[]).find(x=>x.name===pn);
  },[model,child]);
  const exists=childProduct&&(childProduct.attributes||[]).some(a=>a.name===col.trim());
  const pkType=useMemo(()=>{
    if(!pe) return 'BIGINT';
    const [dn,pn]=pe.id.split('.');
    const d=(model.domains||[]).find(x=>x.name===dn);
    const p=d&&(d.products||[]).find(x=>x.name===pn);
    const a=p&&(p.attributes||[]).find(x=>x.name===pe.pk);
    return (a&&a.type)||'BIGINT';
  },[model,pe]);
  const ready=child&&parent&&col.trim()&&!exists;
  const slot=(label,value,which,hint)=>h(Fld,{label,hint},
    h('button',{className:'btn',style:{width:'100%',textAlign:'left',
        color:value?'var(--ink)':'var(--faint)'},
      onClick:()=>setPicking(which)},
      value?value.replace('.',' › '):'Choose an entity…'));
  return h(React.Fragment,null,
    h(Dlg,{title:'New relationship',icon:'⇄',size:'md',onClose,
      sub:'A relationship is a foreign key column on the child entity',
      foot:h(React.Fragment,null,
        exists&&h('span',{style:{fontSize:11,color:'var(--danger)'}},
          '“'+col+'” already exists on '+(ce&&ce.name)),
        h('span',{className:'spacer'}),
        h('button',{className:'btn',onClick:onClose},'Cancel'),
        h('button',{className:'btn btn-accent',disabled:!ready,
          onClick:()=>onSave({child,parent,column:col.trim(),type:pkType,
            description:desc||('Reference to '+(pe?pe.id:'')+'.')})},'Add relationship'))},
      h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr 28px 1fr',alignItems:'end'}},
        slot('Child — holds the key',child,'child','many'),
        h('div',{style:{textAlign:'center',color:'var(--muted)',fontSize:16,paddingBottom:7}},'→'),
        slot('Parent — is referenced',parent,'parent','one')),
      h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr 1fr'}},
        h(Fld,{label:'Column added to the child',hint:'Defaults to the parent’s key'},
          h('input',{type:'text',className:'mono'+(exists?' req-bad':''),value:col,
            onChange:e=>{setTouched(true);setCol(e.target.value.replace(/\s+/g,'_'));}})),
        h(Fld,{label:'Type',hint:'Taken from the parent’s key'},
          h('input',{type:'text',className:'mono',value:pkType,readOnly:true,
            style:{color:'var(--muted)'}}))),
      h('div',{className:'fldrow',style:{gridTemplateColumns:'1fr'}},
        h(Fld,{label:'Why they relate',hint:'The sentence a stakeholder would say out loud'},
          h('input',{type:'text',value:desc,onChange:e=>setDesc(e.target.value),
            placeholder:pe&&ce?('Every '+ce.name+' belongs to one '+pe.name+'.'):'…'}))),
      pe&&!pe.pk&&h('p',{style:{fontSize:11,color:'var(--danger)',margin:'4px 0 0'}},
        pe.name+' has no primary key yet — set one on that entity so the relationship can land on it.')
    ),
    picking&&h(EntityPicker,{model,graphData,
      title:picking==='child'?'Which entity holds the key?':'Which entity is referenced?',
      exclude:picking==='child'?parent:child,
      onClose:()=>setPicking(null),
      onPick:e=>{ (picking==='child'?setChild:setParent)(e.id); setPicking(null); }})
  );
}

/* ── The change ledger ─────────────────────────────────────
   The sidebar tab that answers the question every steering group asks:
   what did we change from the industry standard, and can we put it back? */
function ChangesPanel({base,edits,changeMap,graphData,note,onNote,onOpen,onRevertProduct,
                       onRevertDomain,onRevertAll,onExport}){
  const c=changeMap.counts;
  const colors=(graphData&&graphData.domainColors)||{};
  const [noteOpen,setNoteOpen]=useState(!!(note||'').trim());
  if(!c.total) return h('div',{style:{textAlign:'center',paddingTop:26}},
    h('div',{style:{fontSize:26,marginBottom:10,color:'var(--g-green-line)'}},'≡'),
    h('p',{style:{color:'var(--muted)',fontSize:12,marginBottom:6}},'Unchanged'),
    h('p',{style:{color:'var(--faint)',fontSize:10.5,lineHeight:1.6}},
      'This is the industry model exactly as it ships. Everything you change from here is listed on this tab, and every line can be put back.')
  );
  const groups={added:[],modified:[],removed:[]};
  Object.keys(changeMap.byKey).forEach(k=>{
    const v=changeMap.byKey[k];
    groups[v.state].push({key:k,...v});
  });
  const heads={added:['New entities','add'],modified:['Changed entities','mod'],
               removed:['Removed entities','del']};
  const dstate=changeMap.domState||{};
  const domRows=Object.keys(dstate).sort();
  return h('div',null,
    h('div',{style:{display:'flex',gap:5,marginBottom:9,flexWrap:'wrap'}},
      c.added>0&&h('span',{className:'chip-mini chip-add'},'+'+c.added+' NEW'),
      c.modified>0&&h('span',{className:'chip-mini chip-mod'},c.modified+' CHANGED'),
      c.removed>0&&h('span',{className:'chip-mini chip-del'},'−'+c.removed+' REMOVED')),

    h('div',{style:{display:'flex',gap:6,marginBottom:11}},
      h('button',{className:'btn',style:{flex:1,justifyContent:'center'},
        title:'Download a Markdown summary of everything changed from the industry model',
        onClick:onExport},'Change report'),
      h('button',{className:'btn',style:{color:'var(--danger)'},
        title:'Put the whole model back to the industry version',
        onClick:onRevertAll},'↺ All')),

    h('button',{className:'tbtn',style:{width:'100%',justifyContent:'flex-start',marginBottom:8},
      onClick:()=>setNoteOpen(o=>!o)},(noteOpen?'▾':'▸')+' Session note'),
    noteOpen&&h('textarea',{value:note||'',onChange:e=>onNote(e.target.value),
      placeholder:'Who was in the room, what was agreed, what is still open.',
      style:{minHeight:64,marginBottom:11,fontSize:11}}),

    domRows.length>0&&h('div',null,
      h('div',{className:'section-header'},'Domains'),
      domRows.map(n=>h('div',{key:n,className:'chg-row',style:{cursor:'default'}},
        h('span',{className:'chg-dot '+(dstate[n]==='added'?'add':dstate[n]==='removed'?'del':'mod')}),
        h('span',{className:'name'+(dstate[n]==='removed'?' chg-strike':'')},n),
        h('span',{className:'sub'},dstate[n]),
        h('button',{className:'rowbtn',title:'Restore this domain',
          onClick:e=>{e.stopPropagation();onRevertDomain(n);}},'↺')))),

    ['added','modified','removed'].map(state=>{
      const list=groups[state];
      if(!list.length) return null;
      return h('div',{key:state},
        h('div',{className:'section-header'},heads[state][0]+' ('+list.length+')'),
        list.sort((a,b)=>(a.to||a.from||'').localeCompare(b.to||b.from||'')).map(v=>{
          const path=v.to||v.from||'';
          const dom=path.split('.')[0];
          const was=v.renamed?'  ·  was '+v.from:'';
          return h('div',{key:v.key,className:'chg-row'},
            h('span',{className:'chg-dot '+heads[state][1]}),
            h('span',{className:'name'+(state==='removed'?' chg-strike':''),
                onClick:()=>state!=='removed'&&onOpen(v.key),
                style:{cursor:state==='removed'?'default':'pointer'},
                title:(state==='removed'?'Removed from the model: '+path:'Open '+path)+was},
              h('span',{style:{color:colors[dom]||'var(--muted)',marginRight:5}},'●'),
              v.name,
              v.renamed&&h('span',{className:'sub'},'  was '+v.from.split('.')[1])),
            h('button',{className:'rowbtn',
              title:state==='removed'?'Put this entity back':'Restore the industry model’s version',
              onClick:e=>{e.stopPropagation();onRevertProduct(v.key);}},'↺'));
        }));
    })
  );
}

/* ── Validation ────────────────────────────────────────────
   Not a gate — a reading of what the room just did. Everything here is
   clickable, because an issue nobody can jump to is a nag. */
function IssuesDialog({issues,onOpen,onClose}){
  const [only,setOnly]=useState('all');
  const counts={error:0,warn:0,info:0};
  issues.forEach(i=>{counts[i.sev]++;});
  const shown=only==='all'?issues:issues.filter(i=>i.sev===only);
  const label={error:'Errors',warn:'Warnings',info:'Notes'};
  return h(Dlg,{title:'Model check',icon:'✓',size:'md',onClose,
    sub:issues.length?issues.length+' things worth looking at':'Nothing to report',
    foot:h(React.Fragment,null,h('span',{className:'spacer'}),
      h('button',{className:'btn',onClick:onClose},'Close'))},
    !issues.length&&h('div',{style:{textAlign:'center',padding:'32px 10px'}},
      h('div',{style:{fontSize:34,marginBottom:10,color:'var(--g-green-line)'}},'✓'),
      h('p',{style:{color:'var(--muted)',fontSize:13}},
        'Every entity has a key, every relationship lands somewhere, and no name is used twice.')),
    issues.length>0&&h('div',{className:'seg',style:{marginBottom:11}},
      h('button',{className:only==='all'?'on':'',onClick:()=>setOnly('all')},'All ('+issues.length+')'),
      ['error','warn','info'].map(s=>counts[s]>0&&h('button',{key:s,className:only===s?'on':'',
        onClick:()=>setOnly(s)},label[s]+' ('+counts[s]+')'))),
    shown.map((iss,i)=>h('button',{key:i,className:'issue',onClick:()=>onOpen(iss)},
      h('span',{className:'sev sev-'+(iss.sev==='warn'?'warn':iss.sev==='error'?'error':'info')},
        iss.sev==='warn'?'WARN':iss.sev.toUpperCase()),
      h('span',{className:'txt'},h('b',null,iss.title),h('span',null,iss.body))))
  );
}

/* ── Export menu ───────────────────────────────────────────
   The workshop's output leaves in whichever shape the next step needs: back
   into the toolchain as JSON, into a warehouse as DDL, into dbdiagram as
   DBML, into a steering pack as Markdown, into a glossary as CSV. */
function ExportMenu({onPick,onClose}){
  useEffect(()=>{
    const off=()=>onClose();
    const t=setTimeout(()=>document.addEventListener('click',off),0);
    return ()=>{clearTimeout(t);document.removeEventListener('click',off);};
  },[onClose]);
  const item=(id,label,sub)=>h('button',{key:id,onClick:()=>onPick(id),
    style:{flexDirection:'column',alignItems:'flex-start',gap:1}},
    h('span',{style:{fontWeight:650}},label),
    h('span',{style:{fontSize:10,color:'var(--faint)'}},sub));
  return h('div',{className:'menu',style:{minWidth:250},onClick:e=>e.stopPropagation()},
    item('json','Model JSON','Round-trips into the agent and the installer'),
    item('sql','Databricks SQL DDL','Schemas, tables, keys and constraints'),
    item('dbml','DBML','Paste into dbdiagram.io'),
    item('md','Change report','What moved from the industry model, in Markdown'),
    item('csv','Data dictionary','Every column, for the glossary'));
}

   model as a whole; everything that acts on one thing lives on that thing. */

                    onAddEntity,onAddRel,onCheck,onExport,exportOpen,onExportPick,
                    onExportClose,onRevertAll,onChanges}){
