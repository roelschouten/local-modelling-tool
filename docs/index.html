  body.pal-mono {
    --brand:#4a4a4a; --brand-bd:#c9c9c9; --brand-soft:#dedede; --brand-wash:#f6f6f6;
    --brand-ink:#3a3a3a;
    --flow-neutral:#767676; --flow-medal:#4f4f4f;
    --m-bronze:#6b6b6b; --m-silver:#8a8a8a; --m-gold:#585858;
    /* the neutrals carry a slight blue cast everywhere else, which is right for
       a screen and wrong for the one palette whose job is to have no hue. Each
       value keeps its lightness and loses only the cast, so nothing shifts
       weight and every contrast pair holds. */
    --ink:#1f1f1f; --muted:#616161; --faint:#949494; --sep:#888888;
    --line:#e6e6e6; --line-strong:#d4d4d4;
    --well:#f4f4f4; --panel:#f5f5f5; --plat-fill:#fbfbfb; --logo-ink:#303030; }
  body.pal-mono.theme-dark {
    /* This is the one palette whose brand is lighter than the page, so the
       inherited white --on-accent left every brand-filled control (the ECM/MVM
       segment, Open Model's hover) at 1.56:1. Dark ink instead. */
    --brand:#cfcfcf; --brand-bd:#5a5a5a; --brand-soft:#444444; --brand-wash:#1e1e1e;
    --brand-ink:#e2e2e2; --on-accent:#171717;
    --flow-neutral:#9c9c9c; --flow-medal:#9c9c9c;
    --m-bronze:#b4b4b4; --m-silver:#cccccc; --m-gold:#9d9d9d;
    --ink:#eeeeee; --muted:#b0b0b0; --faint:#8c8c8c; --sep:#838383;
    --line:#333333; --line-strong:#474747;
    --card:#1a1a1a; --well:#242424; --panel:#191919; --plat-fill:#171717;
    --logo-ink:#eeeeee; }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body,#root{height:100%;width:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--well)}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:var(--sep)}
  input,select,button{font-family:inherit;color:var(--ink)}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade-in{animation:fadeIn .2s ease-in}
  .cy-flyin{animation:fadeIn .5s ease-out both}

  .btn{padding:7px 11px;background:var(--card);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;cursor:pointer;font-size:12px;font-weight:650;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--well);border-color:var(--line-strong)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{background:var(--card);border-color:var(--line)}
  .btn:active{background:var(--line)}
  .btn-accent{background:var(--brand);border-color:var(--brand);color:var(--on-accent);flex-shrink:0}
  .btn-accent:hover{filter:brightness(1.06)}
  .btn-danger{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
  .btn-danger:hover{filter:brightness(1.08)}

  .spinner{width:40px;height:40px;border:4px solid var(--line);border-top:4px solid var(--brand);
    border-radius:50%;animation:spin .8s linear infinite}

  select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:6px 8px;font-size:12px;outline:none;cursor:pointer}
  select:focus{border-color:var(--brand)}
  input[type=text]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:8px 10px;font-size:12px;outline:none;width:100%}
  input[type=text]:focus{border-color:var(--brand)}
  input[type=text]::placeholder{color:var(--faint)}
  input[type=range]{accent-color:var(--brand);width:100%;cursor:pointer}
  input[type=checkbox]{accent-color:var(--brand);cursor:pointer}

  .tag-pill{display:inline-block;padding:2px 8px;background:var(--g-violet-tile);color:var(--g-violet-ink);
    border:1px solid var(--g-violet-bd);border-radius:20px;font-size:9px;font-weight:650;margin:0 5px 5px 0}
  .attr-row{padding:7px 0;border-bottom:1px solid var(--line)}
  .domain-box{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:5px}
  .tooltip{position:absolute;background:var(--card);color:var(--ink);font-size:11px;padding:6px 10px;
    border-radius:8px;border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
    pointer-events:none;white-space:normal;z-index:5000;max-width:300px}
  .tree-item{user-select:none;border-radius:6px}
  .tree-item:hover{background:var(--veil)}
  .subdomain-label{font-size:11px;color:var(--muted);font-weight:650}
  .section-header{font-size:11px;color:var(--muted);margin:10px 0 8px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em}

  /* ── gallery chrome ─────────────────────────────────────────── */
  /* One row, and it must stay one row: nowrap plus a single shrinkable
     cell (.topbar-mid) means a narrow window clips the model stats
     instead of pushing the controls onto a second line. */
  .topbar{display:flex;align-items:center;gap:9px;flex-shrink:0;flex-wrap:nowrap;
    padding:6px 12px;background:var(--panel);
    border-bottom:1px solid var(--line);box-shadow:var(--shadow-seam)}
  .topbar-mid{display:flex;align-items:center;gap:9px;min-width:0;flex:1;overflow:hidden}
  .topbar-end{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .topbar-start{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .vrule{width:1px;height:22px;background:var(--line);flex-shrink:0}
  .brandmark{display:flex;align-items:center;gap:7px;white-space:nowrap;flex-shrink:0;
    text-decoration:none;color:inherit}
  .brandmark-dot{width:10px;height:10px;border-radius:3px;background:var(--brand);flex-shrink:0}
  .brandmark-title{font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  /* The wordmark does not shrink, so on small laptops it starved the mid cell
     until the model name had nowhere to sit. The dot keeps the brand present;
     the functional controls get the width. The arrow goes with the words it
     annotates: left on its own beside the dot it reads as a stray glyph. */
  @media (max-width:1200px){
    .brandmark-title,.brandmark .extarrow{display:none}
  }

  /* Searchable industry picker: the trigger names the open model, and opens
     the same palette Cmd-K does rather than a second search of its own. */
  /* Shrinkable, or a long industry name holds the trigger at its full width and
     the deficit lands on the fixed control group instead, pushing the last of it
     (the logo) off the right edge. Shrinking here ellipsises a name nobody needs
     in full, because the same name sits in the link beside the wordmark. */
  .indpick{display:inline-flex;align-items:center;gap:8px;max-width:280px;
    padding:5px 9px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--card);color:var(--ink);font-size:12px;font-weight:700;
    cursor:pointer;white-space:nowrap;flex-shrink:1;min-width:0}
  .indpick:hover{border-color:var(--brand-bd);background:var(--brand-wash)}
  .indpick-name{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .indpick-sec{font-size:10px;font-weight:650;color:var(--faint);flex-shrink:0}
  .indpick-caret{color:var(--muted);font-size:9px;flex-shrink:0}
  .loador{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;white-space:nowrap}
  .loador-sep{font-size:11px;font-weight:650;color:var(--muted)}
  .loadjson{font-size:11px;font-weight:700;color:var(--brand);cursor:pointer;
    text-decoration:underline;text-underline-offset:2px}
  .loadjson:hover{color:var(--ink)}
  /* The section is context for the name, so it goes before the name thins out. */
  @media (max-width:1080px){ .indpick-sec{display:none} }

  /* Shrinks last: which model is open matters more than its counts, so the
     stats give up room first and only a pathological name ellipsizes. It must
     still be shrinkable, or text-overflow can never engage and the mid cell's
     overflow:hidden slices the name off mid-letter instead. It is now the link
     to the model, so it may ellipsise but must never be hidden. */
  .modelname{display:inline-flex;align-items:baseline;gap:3px;
    font-size:12px;font-weight:750;color:var(--ink);white-space:nowrap;
    overflow:hidden;flex-shrink:1;min-width:0;max-width:230px;text-decoration:none}
  .modelname .lbl{overflow:hidden;text-overflow:ellipsis;min-width:0}
  a.modelname:hover{color:var(--brand)}
  a.modelname:hover .extarrow{opacity:1}
  /* Below this the mid cell can only fund an initial and an ellipsis, and at the
     bottom of the band the label reached zero width while the arrow survived,
     leaving an affordance floating between two rules. The picker still names the
     open industry, so the whole cell leaves together with its trailing rule. */
  @media (max-width:920px){
    .modelname,.modelname+.vrule{display:none}
  }

  /* The two links in the bar say so the same way: a muted arrow that firms up on
     hover. It never shrinks, so the name ellipsises under it rather than the
     affordance vanishing. */
  .extarrow{font-size:9px;line-height:1;opacity:.5;flex-shrink:0;transform:translateY(-1px)}

  /* Opens the bar: sits with the wordmark, not at the trailing edge. */
  .dbxlogo{display:inline-flex;align-items:center;flex-shrink:0;color:var(--logo-ink)}
  a.brandmark:hover .brandmark-title{color:var(--brand)}
  a.brandmark:hover .extarrow{opacity:1}

  .tbtn{height:26px;min-width:26px;padding:0 7px;display:inline-flex;align-items:center;
    justify-content:center;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:7px;cursor:pointer;
    font-size:11px;font-weight:700;flex-shrink:0}
  .tbtn.icononly{padding:0 6px}
  .tbtn svg{display:block}
  .tbtn:hover{background:var(--well);border-color:var(--line-strong)}

  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card);flex-shrink:0}
  .seg button{padding:5px 11px;border:0;background:transparent;color:var(--muted);font-size:11px;
    white-space:nowrap;
    font-weight:700;cursor:pointer;letter-spacing:.04em}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{background:var(--veil);color:var(--ink)}
  .seg button.on{background:var(--brand);color:var(--on-accent)}

  .stat{display:inline-flex;align-items:baseline;gap:4px;font-size:11px;white-space:nowrap}
  .stat b{font-size:12px;font-weight:800;color:var(--ink)}
  .stat span{color:var(--muted)}
  /* The stats are the one thing allowed to disappear when the line runs out of
     room, because everything beside them is a control.

     Chips do not shrink, so a narrow bar used to slice the last one mid-word
     ("13 Domain"). Wrapping instead pushes whichever chips do not fit onto a
     second row that max-height clips away, so a chip is either fully readable
     or fully absent. 17px is one chip row; the 10px gap puts row two clear.

     The large flex-shrink makes the counts absorb essentially the whole deficit
     before the model name gives up a pixel, so the name stays whole while the
     counts thin out and only ellipsises once they are gone. */
  .statset{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:center;
    gap:10px;min-width:0;overflow:hidden;max-height:17px;flex-shrink:9999}
  .statset .stat{flex-shrink:0}
  /* Must follow .statset's own display rule to win the cascade. Below this the
     counts are down to a digit or two and worthless, so the whole set goes
     rather than lingering as a sliced fragment.

     Wrapping only hides a chip that can move to the clipped second row, so it
     cannot save a chip that is itself wider than the cell: at 1200 the longest
     industry name left the counts 56px against a 64px "13 Domains" and the chip
     was sliced. The cell gets viewport minus about 1224px for the longest name
     in the gallery, so one chip needs roughly 1340px; 1360 keeps a margin. The
     cost is that short-named models lose their counts a little earlier than they
     strictly must, which is the trade this element was chosen to absorb. */
  @media (max-width:1360px){ .statset{display:none} }

  .iconbtn{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;
    padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    cursor:pointer;font-size:13px}
  .iconbtn:hover{background:var(--well);border-color:var(--line-strong)}

  .menu{position:absolute;top:calc(100% + 6px);right:0;z-index:4000;min-width:168px;padding:6px;
    background:var(--card);border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow-lg)}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;
    background:transparent;color:var(--ink);font-size:12px;font-weight:650;text-align:left;
    border-radius:7px;cursor:pointer}
  .menu button:hover{background:var(--veil)}
  .menu button.on{color:var(--brand)}
  .swatch{display:inline-flex;gap:2px;flex-shrink:0}
  .swatch i{width:7px;height:14px;border-radius:2px;display:block}

  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:4500;display:flex;
    align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
  .palette{width:min(600px,94vw);max-height:66vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line-strong);border-radius:14px;
    box-shadow:var(--shadow-xl);overflow:hidden}
  .palette-head{padding:12px 14px;border-bottom:1px solid var(--line);flex-shrink:0}
  .palette-list{overflow-y:auto;padding:6px}
  .palette-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;
    background:transparent;color:var(--ink);font-size:13px;text-align:left;border-radius:8px;cursor:pointer}
  .palette-row:hover,.palette-row.cursor{background:var(--brand-wash);outline:1px solid var(--brand-bd)}
  .palette-row small{color:var(--faint);font-size:11px;margin-left:auto;white-space:nowrap}

  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);transition:width .18s ease-out}

  .tour-hole{position:fixed;border-radius:10px;pointer-events:none;z-index:6000;
    box-shadow:0 0 0 3px var(--brand),0 0 0 9999px rgba(0,0,0,.55);
    transition:top .25s cubic-bezier(.4,0,.2,1),left .25s cubic-bezier(.4,0,.2,1),
      width .25s cubic-bezier(.4,0,.2,1),height .25s cubic-bezier(.4,0,.2,1)}
  .tour-pop{position:fixed;z-index:6001;width:304px;max-width:calc(100vw - 24px);
    background:var(--card);color:var(--ink);border:1px solid var(--line-strong);
    border-radius:14px;box-shadow:var(--shadow-xl);padding:15px 16px 11px}
  .tour-pop h4{margin:0 0 6px;font-size:14px;font-weight:750;color:var(--ink)}
  .tour-pop p{margin:0 0 13px;font-size:12.5px;line-height:1.55;color:var(--muted)}
  .tour-pop kbd{background:var(--well);border:1px solid var(--line-strong);border-radius:5px;
    padding:0 5px;font-size:11px;font-family:inherit}
  .tour-row{display:flex;align-items:center;gap:8px}
  .tour-step{font-size:11px;color:var(--faint);margin-right:auto;letter-spacing:.02em}
  .tour-skip{background:transparent;border:0;color:var(--faint);cursor:pointer;
    font:inherit;font-size:12px;padding:6px 4px}
  .tour-skip:hover{color:var(--muted)}

  /* ERD relationship lines. Routing happens in JS; this only handles the
     resting/hover look and the invisible fat path that makes them clickable. */
  .erd-link{stroke:var(--flow-neutral);fill:none;stroke-width:1.5;
    stroke-linejoin:round;stroke-linecap:round;transition:stroke .12s,stroke-width .12s}
  .erd-hit{stroke:transparent;fill:none;stroke-width:15;pointer-events:stroke;cursor:pointer}
  .erd-conn:hover .erd-link,.erd-conn.sel .erd-link{stroke:var(--brand);stroke-width:2.5}
  /* the crow's foot and the bar are separate marker glyphs, so the highlight
     has to swap them rather than recolour them */
  .erd-conn:hover .erd-link,.erd-conn.sel .erd-link{
    marker-start:url(#erd-many-hi);marker-end:url(#erd-one-hi)}
  /* the name rides in an opaque chip so it stays readable wherever the route
     puts it - over a gutter, over another line, or over a card */
  .erd-chip{fill:var(--card);stroke:var(--line-strong);stroke-width:1;rx:3;pointer-events:none}
  .erd-label{fill:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9.5px;pointer-events:none;dominant-baseline:central}
  .erd-conn:hover .erd-chip,.erd-conn.sel .erd-chip{fill:var(--card);stroke:var(--brand)}
  .erd-conn:hover .erd-label,.erd-conn.sel .erd-label{fill:var(--brand);font-weight:700}
  /* past a few dozen links every name at once is a grey haze, so a dense
     diagram keeps them for the link under the pointer or the selected one */
  .erd-dense .erd-tag{display:none}
  .erd-dense .erd-conn:hover .erd-tag,.erd-dense .erd-conn.sel .erd-tag{display:block}

  /* Business domain map. Columns are operating models, lanes are the rows that
     run across them, and a lane is cut into cells that each cover one or more
     columns. Nothing here positions a tile: every position comes from the saved
     board, so the sheet only owns the resting look and the drag affordances. */
  .bmap-colhead{display:grid;position:sticky;top:0;z-index:6;
    padding:8px 13px;margin-bottom:6px;background:var(--bg);
    border-bottom:1px solid var(--line)}
  .bmap-colcell{display:flex;align-items:center;gap:4px;min-width:0;padding:0 10px}
  .bmap-colcell+.bmap-colcell{border-left:1px dashed var(--line-strong)}
  .bmap-colname{font-size:11px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--muted);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bmap-lane{border:1px solid var(--line);border-radius:12px;background:var(--card);
    margin-bottom:16px;box-shadow:var(--shadow)}
  .bmap-lane-head{display:flex;align-items:center;gap:8px;padding:9px 12px;
    border-bottom:1px solid var(--line);background:var(--well);
    border-radius:11px 11px 0 0}
  .bmap-lane-name{font-size:12px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  /* the lane's own grid: one track per operating model, cells spanning them */
  .bmap-cells{display:grid;padding:12px;align-items:start}
  .bmap-cell{min-width:0;padding:0 10px;border-radius:8px}
  .bmap-cell+.bmap-cell{border-left:1px dashed var(--line-strong)}
  .bmap-cell-head{display:flex;align-items:center;gap:5px;margin-bottom:7px;
    font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint)}
  .bmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:10px;align-items:start}
  .bmap-tile{border-radius:10px;padding:10px 11px;text-align:left;font:inherit;
    display:flex;flex-direction:column;gap:6px;min-width:0;
    transition:box-shadow .12s,transform .12s}
  .bmap-tile.pick{cursor:pointer}
  /* in edit mode the whole tile is the drag source, apart from its own select */
  .bmap-tile[draggable="true"]{cursor:grab}
  .bmap-tile[draggable="true"] select{cursor:pointer}
  .bmap-tile.pick:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
  .bmap-tile.open{grid-column:1/-1}
  .bmap-tile-name{font-size:12.5px;font-weight:800;letter-spacing:.04em;
    text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bmap-tile-desc{font-size:10.5px;line-height:1.45;opacity:.85;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bmap-sub{font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;
    background:var(--veil);white-space:nowrap}
  .bmap-vacant{border:1px dashed var(--line-strong);background:var(--well);
    color:var(--muted);align-items:stretch}
  /* the one way to fill a cell: press it for a slot, or drop a domain on it */
  .bmap-add{min-height:46px;padding:10px;border:1px dashed var(--line-strong);
    border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;
    font:inherit;font-size:11px;font-weight:700}
  .bmap-add:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-wash)}
  /* where a dragged tile would land */
  .bmap-drop{outline:2px dashed var(--brand);outline-offset:2px}
  .bmap-row{display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;
    border:0;border-radius:6px;background:transparent;font:inherit;font-size:11.5px;
    color:var(--ink);cursor:pointer;text-align:left}
  .bmap-row:hover{background:var(--veil)}
  .bmap-row.sel{background:var(--brand-wash);outline:1px solid var(--brand-bd);color:var(--brand-ink)}
  .bmap-row b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .bmap-row small{color:var(--faint);font-size:10px;flex-shrink:0}
  .bmap-grip{cursor:grab;color:var(--muted);font-size:11px;line-height:1;
    background:transparent;border:0;padding:0 2px}
  .bmap-x{width:18px;height:18px;padding:0;flex-shrink:0;background:transparent;
    border:1px solid transparent;border-radius:4px;color:var(--muted);cursor:pointer;
    font-size:10px;line-height:16px}
  .bmap-x:hover:not(:disabled){border-color:var(--line-strong);color:var(--danger)}
  .bmap-x:disabled{opacity:.3;cursor:not-allowed}
  /* =====================================================================
     DESIGN MODE
     =====================================================================
     The viewer turns into an editor. Nothing here is a second theme: every
     surface takes the same neutrals and group slots the read-only chrome
     does, so a model being edited still looks like the model. The only new
     colour language is the change ledger — added / changed / removed — and
     it is three group hues, not three new ones. */
  .designbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex-shrink:0;
    padding:7px 13px;background:var(--panel);border-bottom:1px solid var(--line);
    box-shadow:var(--shadow-seam)}
  .designbar .vrule{height:20px}
  .designbar-note{font-size:11px;color:var(--faint);margin-left:auto;white-space:nowrap}
  .saved-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)}
  .saved-dot i{width:7px;height:7px;border-radius:50%;background:var(--g-green-line);display:block}
  .saved-dot.dirty i{background:var(--g-amber-line)}

  /* change ledger colours: added / modified / removed */
  .chg-add{color:var(--g-green-ink)}
  .chg-mod{color:var(--g-amber-ink)}
  .chg-del{color:var(--g-rose-ink)}
  .chg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
  .chg-dot.add{background:var(--g-green-line)}
  .chg-dot.mod{background:var(--g-amber-line)}
  .chg-dot.del{background:var(--g-rose-line)}
  .chg-row{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;
    border:1px solid transparent;border-radius:7px;background:transparent;
    color:var(--ink);font:inherit;font-size:11px;text-align:left;cursor:pointer}
  .chg-row:hover{background:var(--veil);border-color:var(--line)}
  .chg-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chg-row .sub{font-size:9.5px;color:var(--faint)}
  .chg-strike{text-decoration:line-through;opacity:.7}

  /* the row buttons that appear on hover in the outline while editing */
  .row-act{width:18px;height:18px;padding:0;flex-shrink:0;display:none;
    align-items:center;justify-content:center;background:transparent;
    border:1px solid transparent;border-radius:4px;color:var(--muted);
    cursor:pointer;font-size:10px;line-height:1}
  .row-act:hover{background:var(--card);border-color:var(--line-strong);color:var(--ink)}
  .tree-item:hover .row-act,.erd-card:hover .row-act{display:inline-flex}

  /* ── dialogs ──────────────────────────────────────────── */
  .dlg-scrim{position:fixed;inset:0;background:var(--scrim);z-index:5000;display:flex;
    align-items:center;justify-content:center;padding:24px 16px}
  .dlg{display:flex;flex-direction:column;width:min(980px,96vw);max-height:90vh;
    background:var(--card);border:1px solid var(--line-strong);border-radius:14px;
    box-shadow:var(--shadow-xl);overflow:hidden}
  .dlg.sm{width:min(520px,96vw)}
  .dlg.md{width:min(700px,96vw)}
  .dlg-head{display:flex;align-items:center;gap:10px;padding:13px 16px;flex-shrink:0;
    border-bottom:1px solid var(--line);background:var(--well)}
  .dlg-head h3{margin:0;font-size:14px;font-weight:750;color:var(--ink)}
  .dlg-head .sub{font-size:11px;color:var(--muted)}
  .dlg-x{margin-left:auto;width:26px;height:26px;border:1px solid var(--line);
    border-radius:7px;background:var(--card);color:var(--muted);cursor:pointer;font-size:14px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .dlg-x:hover{color:var(--ink);border-color:var(--line-strong)}
  .dlg-body{padding:14px 16px;overflow:auto;flex:1;min-height:0}
  .dlg-foot{display:flex;align-items:center;gap:8px;padding:11px 16px;flex-shrink:0;
    border-top:1px solid var(--line);background:var(--well)}
  .dlg-foot .spacer{flex:1}

  .fld{display:flex;flex-direction:column;gap:4px;min-width:0}
  .fld>label{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted)}
  .fld .hint{font-size:10px;color:var(--faint)}
  .fldrow{display:grid;gap:10px;margin-bottom:11px}
  input[type=text],input[type=search],textarea,select{background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;
    font-family:inherit;width:100%;box-sizing:border-box}
  textarea{resize:vertical;line-height:1.5;min-height:56px}
  textarea:focus,input[type=search]:focus{border-color:var(--brand);outline:none}
  input.mono,textarea.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .req-bad{border-color:var(--danger)!important}

  /* ── the column grid: the part that has to feel like a spreadsheet ── */
  .colgrid{border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .colgrid-head,.colgrid-row{display:grid;
    grid-template-columns:26px minmax(120px,1.3fr) minmax(96px,.9fr) 34px minmax(150px,1.5fr) minmax(150px,2fr) 52px;
    gap:0;align-items:center}
  .colgrid-head{background:var(--well);border-bottom:1px solid var(--line-strong);
    font-size:9.5px;font-weight:750;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .colgrid-head>div{padding:6px 7px}
  .colgrid-body{max-height:46vh;overflow-y:auto}
  .colgrid-row{border-bottom:1px solid var(--veil)}
  .colgrid-row:hover{background:var(--well)}
  .colgrid-row.is-pk{background:var(--g-amber-bg)}
  .colgrid-row>div{padding:3px 4px;min-width:0}
  .colgrid-row .idx{font-size:9.5px;color:var(--faint);text-align:center;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .colgrid input[type=text],.colgrid textarea{border-color:transparent;background:transparent;
    padding:5px 6px;border-radius:5px;font-size:11.5px}
  .colgrid input[type=text]:hover,.colgrid textarea:hover{background:var(--card);border-color:var(--line)}
  .colgrid input[type=text]:focus,.colgrid textarea:focus{background:var(--card);border-color:var(--brand)}
  .fk-cell{display:flex;align-items:center;gap:4px;min-width:0}
  .fk-btn{flex:1;min-width:0;text-align:left;padding:5px 6px;border-radius:5px;
    border:1px solid transparent;background:transparent;color:var(--danger);cursor:pointer;
    font:inherit;font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fk-btn.empty{color:var(--faint)}
  .fk-btn:hover{background:var(--card);border-color:var(--line)}
  .rowbtns{display:flex;gap:2px;justify-content:flex-end;padding-right:5px}
  .rowbtn{width:19px;height:19px;padding:0;display:inline-flex;align-items:center;
    justify-content:center;background:transparent;border:1px solid transparent;border-radius:4px;
    color:var(--faint);cursor:pointer;font-size:10px;line-height:1}
  .rowbtn:hover{background:var(--card);border-color:var(--line-strong);color:var(--ink)}
  .rowbtn.danger:hover{color:var(--danger);border-color:var(--danger-bd)}

  /* ── issue list ───────────────────────────────────────── */
  .issue{display:flex;gap:8px;align-items:flex-start;width:100%;padding:8px 9px;
    border:1px solid var(--line);border-radius:8px;background:var(--card);margin-bottom:6px;
    text-align:left;font:inherit;cursor:pointer;color:var(--ink)}
  .issue:hover{border-color:var(--line-strong);background:var(--well)}
  .issue .sev{font-size:9px;font-weight:800;letter-spacing:.05em;padding:1px 6px;border-radius:4px;
    flex-shrink:0;margin-top:1px}
  .sev-error{background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger-bd)}
  .sev-warn{background:var(--g-amber-tile);color:var(--g-amber-ink);border:1px solid var(--g-amber-bd)}
  .sev-info{background:var(--g-blue-tile);color:var(--g-blue-ink);border:1px solid var(--g-blue-bd)}
  .issue .txt{min-width:0;flex:1}
  .issue .txt b{display:block;font-size:11.5px;font-weight:650;margin-bottom:1px}
  .issue .txt span{font-size:10.5px;color:var(--muted);line-height:1.45}

  /* ── pickers ──────────────────────────────────────────── */
  .pick-row{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;
    background:transparent;color:var(--ink);font:inherit;font-size:12px;text-align:left;

<div id="root"></div>
<script>
/* ─────────────────────────────────────────────────────────
   MODEL VIEWER - React + Cytoscape.js
   ─────────────────────────────────────────────────────── */
const {useState,useEffect,useLayoutEffect,useRef,useCallback,useMemo,memo} = React;
const h = React.createElement;

// ── Constants ─────────────────────────────────────────────
const HUE_GROUPS = ['green','teal','blue','slate','violet','plum','rose','coral','amber'];
const DOMAIN_SLOTS = [
  '--g-green-line', '--g-teal-line', '--g-blue-line', '--g-slate-line', '--g-violet-line', '--g-plum-line', '--g-rose-line', '--g-coral-line', '--g-amber-line',
  '--g-green-ink', '--g-teal-ink', '--g-blue-ink', '--g-slate-ink', '--g-violet-ink', '--g-plum-ink', '--g-rose-ink', '--g-coral-ink', '--g-amber-ink',
];
const SUBDOMAIN_SLOTS = [
  '--g-green-head', '--g-teal-head', '--g-blue-head', '--g-slate-head', '--g-violet-head', '--g-plum-head', '--g-rose-head', '--g-coral-head', '--g-amber-head',
  '--g-green-line', '--g-teal-line', '--g-blue-line', '--g-slate-line', '--g-violet-line', '--g-plum-line', '--g-rose-line', '--g-coral-line', '--g-amber-line',
  '--g-green-ink', '--g-teal-ink', '--g-blue-ink', '--g-slate-ink', '--g-violet-ink', '--g-plum-ink', '--g-rose-ink', '--g-coral-ink', '--g-amber-ink',
];
const DEFAULT_W = 500, DEFAULT_H = 400;
const TREE_ATTR_CAP = 250;

// ── Theme ─────────────────────────────────────────────────
const THEME_KEY='dbx-model-theme', PAL_KEY='dbx-model-pal', ANIM_KEY='dbx-model-animate';
/* Every outbound GitHub link in the chrome points here. Industry model JSON is
   fetched from upstream main via modelUrls(); manifest.source is not used for loads. */
const UPSTREAM_REPO={owner:'databricks-industry-solutions',repo:'lakehouse-industry-data-models'};
const PALETTES=[
  {id:'default',label:'Default'},{id:'muted',label:'Muted'},{id:'vivid',label:'Vivid'},
  {id:'ocean',label:'Ocean'},{id:'sunset',label:'Sunset'},{id:'mono',label:'Mono'},
  {id:'solid',label:'Solid'},{id:'pop',label:'Pop'},{id:'neon',label:'Neon'},
  {id:'earth',label:'Earth'},{id:'jewel',label:'Jewel'},{id:'nordic',label:'Nordic'},
  {id:'berry',label:'Berry'},
];
const store={
  get(k,fb){try{return localStorage.getItem(k)||fb;}catch(e){return fb;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
};
const GC={code:'amralieg',host:'goatcounter.com'};
const _gcQueue=[]; let _gcReady=false;
function gcEnabled(){return GC.code&&GC.code!=='CODE'&&/\.github\.io$/.test(location.hostname);}
function gcFlush(){
  if(!window.goatcounter||typeof window.goatcounter.count!=='function') return;
  while(_gcQueue.length){try{window.goatcounter.count(_gcQueue.shift());}catch(e){}}
}
function gcCount(o){ if(!gcEnabled()) return; _gcQueue.push(o); if(_gcReady) gcFlush(); }
function gcModelView(slug,version,flavour,display){
  if(!slug) return;
  const v=(version||'').toUpperCase(),f=(flavour||'').toUpperCase();
  gcCount({path:`/model/${slug}/${version||'v'}/${flavour||'na'}`,

}
function gcEvent(name,title){ gcCount({path:name,title:title||name,event:true}); }
function gcInit(){
  if(!gcEnabled()) return;
  window.goatcounter={no_onload:true};
  const s=document.createElement('script');
  s.async=true; s.src='//gc.zgo.at/count.js';
  s.setAttribute('data-goatcounter',`https://${GC.code}.${GC.host}/count`);
  s.addEventListener('load',()=>{
    _gcReady=true;

}
gcInit();
function currentTheme(){return document.body.classList.contains('theme-dark')?'dark':'light';}
function currentPalette(){
  const m=(document.body.className||'').match(/\bpal-([a-z]+)\b/);
  return m?m[1]:'default';
}
function currentAnimate(){

  return v!=='0'&&v!=='false';
}

  store.set(THEME_KEY,theme);
}
function applyPalette(pal){

  if(pal&&pal!=='default') document.body.classList.add('pal-'+pal);
  store.set(PAL_KEY,pal||'default');
}

// ── Graph data extraction ──────────────────────────────────
function extractGraph(dataModel) {
  const nodes = [], edges = [];
  const domainColors = {}, domainStats = {}, domainHierarchy = {}, domainSlots = {};
  let totalAttrs = 0, totalTags = 0;

  const domains = dataModel.domains || [];
  domains.forEach((domain, idx) => {
    const dname = domain.name || `domain_${idx}`;
    const slot = DOMAIN_SLOTS[idx % DOMAIN_SLOTS.length];
    const color = 'var('+slot+')';
    domainColors[dname] = color;
    domainSlots[dname] = slot;

    let dAttr=0, dFk=0, dTag=0, dTbl=0;
    domainHierarchy[dname] = {
      color, slot, description: domain.description||'', division: domain.division||'',
      tables:{}, subdomains:{}
    };

    (domain.products||[]).forEach(product => {
      const tname = product.name||'';
      const fullId = `${dname}.${tname}`;
      const subdomain = product.subdomain||'';
      dTbl++;

      const attrs = product.attributes||[];
      const attrList = attrs.map(a => {
        // Handle tags as string or array; detect primary_key
        const tagsVal = a.tags;
        const isPk = a.primary_key===true || a.primary_key==='true'
          || (typeof tagsVal==='string' && tagsVal.toLowerCase().includes('primary_key'))
          || (Array.isArray(tagsVal) && tagsVal.some(t=>t.toLowerCase().includes('primary_key')));
        const fk = (a.foreign_key_to||'').trim();
        return {
          name: a.name||'', type: a.type||'', fk, pk: isPk,
          desc: a.description||a.desc||'', tags: Array.isArray(tagsVal)?tagsVal: tagsVal?[tagsVal]:[]
        };
      });

      const fkCount = attrList.filter(a=>a.fk).length;
      const tagArr = Array.isArray(product.tags)?product.tags: product.tags?[product.tags]:[];
      dAttr+=attrList.length; dFk+=fkCount; dTag+=tagArr.length;
      totalAttrs+=attrList.length; totalTags+=tagArr.length;

      const tableEntry = {
        full_id:fullId, description:product.description||'', tags:tagArr,
        attributes:attrList, attribute_count:attrList.length, fk_count:fkCount, subdomain
      };
      domainHierarchy[dname].tables[tname] = tableEntry;

      if(subdomain){
        if(!domainHierarchy[dname].subdomains[subdomain])
          domainHierarchy[dname].subdomains[subdomain]={tables:[],attr_count:0,fk_count:0};
        const sd=domainHierarchy[dname].subdomains[subdomain];
        sd.tables.push(tname); sd.attr_count+=attrList.length; sd.fk_count+=fkCount;
      }

      nodes.push({
        data:{id:fullId,label:tname,
              erd_label:[tname.toUpperCase(),'--------------------------------',...attrList.map(a=>{
                const marker=a.pk?'PK ':a.fk?'FK ':'   ';
                return `${marker}${String(a.name).padEnd(28,' ')} ${a.type||'UNKNOWN'}`;
              })].join('\n'),
              erd_height:Math.max(90,56+attrList.length*16),
              parent:`domain_${dname}`,type:'table',
              domain:dname,subdomain,attribute_count:attrList.length,
              fk_count:fkCount,tag_count:tagArr.length,color,slot},
        classes:'table-node'
      });

      attrList.forEach(attr=>{
        if(!attr.fk) return;
        const parts=attr.fk.split('.');
        if(parts.length<2) return;
        const targetId=`${parts[0]}.${parts[1]}`;
        const targetCol=parts[2]||`${parts[1]}_id`;
        // agent-synthesised FKs carry a `_dbx_fk_*` tag (declared UC FKs do not).
        const isDbxFk=(attr.tags||[]).some(t=>/(^|_)dbx_fk/i.test(String(t)));
        edges.push({
          data:{
            id:`edge_${fullId}_${targetId}_${attr.name}`,
            source:fullId,target:targetId,label:attr.name,
            source_domain:dname,target_domain:parts[0],
            source_column:attr.name,target_column:targetCol,
            source_table:tname,target_table:parts[1],fk_full:attr.fk,
            dbx_fk:isDbxFk
          },
          classes:isDbxFk?'fk-edge dbx-fk-edge':'fk-edge'
        });
      });
    });

    domainStats[dname]={table_count:dTbl,attr_count:dAttr,fk_count:dFk,tag_count:dTag};
    nodes.push({
      data:{id:`domain_${dname}`,label:dname.toUpperCase(),
            type:'domain',color,slot,
            division:domain.division||'',table_count:dTbl,attr_count:dAttr,
            fk_count:dFk,tag_count:dTag,width:DEFAULT_W,height:DEFAULT_H},
      classes:'domain-node'
    });
  });

  return {nodes,edges,domainColors,domainStats,domainHierarchy,domainSlots,
          totalAttrs,totalTags,
          modelName:dataModel.name||'Data Model',
          modelVersion:dataModel.version||''};
}

// ── Precompute indexes ─────────────────────────────────────
function buildIndexes(graphData){
  const {nodes,edges}=graphData;
  const tableById={}, domainByName={}, tablesByDomain={};
  const edgesBySource={}, edgesByTarget={}, edgesWithinDomain={};
  nodes.forEach(n=>{
    if(n.classes==='table-node'){
      tableById[n.data.id]=n;
      const d=n.data.domain;
      if(d){(tablesByDomain[d]=tablesByDomain[d]||[]).push(n);}
    } else if(n.classes==='domain-node'){
      const k=n.data.id.replace('domain_','');
      domainByName[k]=n;
    }
  });
  edges.forEach(e=>{
    const s=e.data.source,t=e.data.target;
    (edgesBySource[s]=edgesBySource[s]||[]).push(e);
    (edgesByTarget[t]=edgesByTarget[t]||[]).push(e);
    const sd=s.split('.')[0],td=t.split('.')[0];
    if(sd&&sd===td)(edgesWithinDomain[sd]=edgesWithinDomain[sd]||[]).push(e);
  });
  return {tableById,domainByName,tablesByDomain,edgesBySource,edgesByTarget,edgesWithinDomain};
}

// ── Domain view positions ──────────────────────────────────
function calcDomainViewPositions(filteredNodes){
  const groups={};
  filteredNodes.forEach(n=>{
    if(n.classes==='table-node'||n.classes==='table-node domain-view-node'){
      const p=n.data.parent||'__ungrouped__';
      (groups[p]=groups[p]||[]).push(n);
    }
  });
  if(!Object.keys(groups).length) return {};
  const sorted=Object.entries(groups).sort((a,b)=>a[0]==='__ungrouped__'?1:b[0]==='__ungrouped__'?-1:a[0].localeCompare(b[0]));
  const ns=130; // spacing between nodes inside a group
  const pad=160; // extra padding around each group for subdomain box + label

  // Calculate each group's bounding size including padding
  const groupSizes=sorted.map(([,tables])=>{
    const cols=Math.max(1,Math.ceil(Math.sqrt(tables.length)));
    const rows=Math.ceil(tables.length/cols);
    return {w:cols*ns+pad, h:rows*ns+pad, cols, rows};
  });

  const numGroups=sorted.length;
  if(numGroups===1){
    const tables=sorted[0][1];
    const {cols}=groupSizes[0];
    const positions={};
    tables.forEach((n,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      positions[n.data.id]={x:(col-(cols-1)/2)*ns, y:(row-(Math.ceil(tables.length/cols)-1)/2)*ns};
    });
    return positions;
  }

  // Grid layout: pack subdomain boxes into rows/cols using max width/height per column/row
  const gap=100;
  const gCols=Math.ceil(Math.sqrt(numGroups));
  const gRows=Math.ceil(numGroups/gCols);
  const colWidths=new Array(gCols).fill(0);
  const rowHeights=new Array(gRows).fill(0);
  groupSizes.forEach((g,gi)=>{
    const gc=gi%gCols, gr=Math.floor(gi/gCols);
    colWidths[gc]=Math.max(colWidths[gc],g.w);
    rowHeights[gr]=Math.max(rowHeights[gr],g.h);
  });
  const totalW=colWidths.reduce((s,w)=>s+w,0)+(gCols-1)*gap;
  const totalH=rowHeights.reduce((s,h)=>s+h,0)+(gRows-1)*gap;
  const colCenters=colWidths.map((w,i)=>{
    let x=-totalW/2;
    for(let k=0;k<i;k++) x+=colWidths[k]+gap;
    return x+w/2;
  });
  const rowCenters=rowHeights.map((h,i)=>{
    let y=-totalH/2;
    for(let k=0;k<i;k++) y+=rowHeights[k]+gap;
    return y+h/2;
  });

  const positions={};
  sorted.forEach(([,tables],gi)=>{
    const gc=gi%gCols, gr=Math.floor(gi/gCols);
    const cx=colCenters[gc], cy=rowCenters[gr];
    const {cols,rows}=groupSizes[gi];
    tables.forEach((n,i)=>{
      const row=Math.floor(i/cols),col=i%cols;
      positions[n.data.id]={x:cx+(col-(cols-1)/2)*ns, y:cy+(row-(rows-1)/2)*ns};
    });
  });
  return positions;
}

// ── Cytoscape stylesheet ──────────────────────────────────
/* Cytoscape parses its stylesheet itself and never resolves a CSS custom
   property, so every colour the canvas uses has to be read out of the document
   as a literal first and re-read whenever the theme or palette changes. */
const THEME_SLOTS={ink:'--ink',muted:'--muted',faint:'--faint',line:'--line',
  lineStrong:'--line-strong',bg:'--bg',card:'--card',well:'--well',panel:'--panel',
  brand:'--brand',gold:'--m-gold',flow:'--flow-neutral',
  green:'--g-green-line',rose:'--g-rose-line',danger:'--danger'};

function resolveTheme(){
  const cs=getComputedStyle(document.body);
  const read=(v,fb)=>(cs.getPropertyValue(v)||'').trim()||fb;
  const t={};
  for(const k in THEME_SLOTS) t[k]=read(THEME_SLOTS[k],'#888888');
  t.domainRing=DOMAIN_SLOTS.map(v=>read(v,'#888888'));
  t.subdomainRing=SUBDOMAIN_SLOTS.map(v=>read(v,'#888888'));
  t.slot=(name)=>name?read(name,t.muted):t.muted;
  t.key=(document.body.className||'')+'|'+t.ink+t.card+t.domainRing.join('');
  return t;
}

/* A node keeps the NAME of its colour slot, not the colour, so a palette swap
   is a re-read rather than a re-layout. */
function paintElements(elements,t){
  return elements.map(el=>{
    const slot=el.data&&el.data.slot;
    if(!slot) return el;
    return Object.assign({},el,{data:Object.assign({},el.data,{color:t.slot(slot)})});
  });
}

function repaintGraph(cy,t){
  if(!cy) return;
  cy.batch(()=>{
    cy.nodes().forEach(n=>{
      const slot=n.data('slot');
      if(slot) n.data('color',t.slot(slot));
    });
  });
}

/* The hue behind a slot name or a var() reference to one, e.g. --g-teal-line and
   var(--g-teal-ink) both give 'teal'. '' for the non-hue slots (--m-gold,
   --danger, --brand), whose callers fall back to a neutral. */
function hueOfSlot(slot){
  const m=/--g-([a-z]+)-/.exec(slot||'');
  return m?m[1]:'';
}

/* Style for a filled chip on a hue. Composed from tile/ink/bd, never from
   line/head/ink: those are STROKE colours, dark in BOTH themes, so filling with
   one and writing --ink on top gives a dark block with dark text in light mode.
   tile/ink flip per theme, so the chip stays legible in both. */
function hueChip(hue){
  return hue
    ?{background:`var(--g-${hue}-tile)`,color:`var(--g-${hue}-ink)`,
      border:`1px solid var(--g-${hue}-bd)`}
    :{background:'var(--well)',color:'var(--ink)',border:'1px solid var(--line)'};
}

function prefersReducedMotion(){
  return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
}

/* Entry animation. Every arrangement in this viewer is radial — the main view
   rings its domains, a domain view rings its products — so a node's finished
   position is already polar about the centre, and the entry is just that polar
   pair animated: the radius grows from nothing while an extra twist unwinds to
   nothing. Everything therefore starts as one dot in the middle and spirals out
   into place, and no separate set of start positions has to be invented.

   Only childless nodes are moved. Cytoscape derives a compound parent's box from
   its children, so the domain boxes grow out of the middle for free.

   Edges are held for the run and released in waves on arrival: they are the bulk
   of the per-frame cost, and holding them is what lets 542 nodes move at frame
   rate on the largest model. It has to be display, not visibility. A
   visibility:hidden edge is still walked and its geometry still recomputed every
   frame, so it bought almost nothing (measured on the largest model: 150ms per
   frame drawn, 124ms with visibility:hidden, 41ms with display:none).

   Call it with the viewport already fitted: that fit is the destination. */
function playSpiralIntro(cy,host,cinematic){
  const w=cy.width(),h=cy.height();
  if(!w||!h) return null;
  const zTo=cy.zoom(),pTo=Object.assign({},cy.pan());
  if(!(zTo>0)) return null;

  const movers=cy.nodes().filter(n=>n.isChildless());
  if(movers.length<2) return null;

  let sx=0,sy=0;
  movers.forEach(n=>{const p=n.position();sx+=p.x;sy+=p.y;});
  const ox=sx/movers.length,oy=sy/movers.length;

  const seeds=[];
  let rMax=0;
  movers.forEach(n=>{
    const p=n.position(),dx=p.x-ox,dy=p.y-oy;
    const r=Math.hypot(dx,dy);
    if(r>rMax) rMax=r;
    seeds.push({n,x:p.x,y:p.y,r,a:Math.atan2(dy,dx)});
  });
  // A single point has no radius to grow along, so there is nothing to spiral.
  if(!(rMax>0)) return null;

  const dur=cinematic?1500:620;
  const swirl=cinematic?5.2:1.5;   // radians of twist, unwound by arrival
  const lag=cinematic?0.45:0.22;   // share of the run spent releasing outer rings
  const lift=cinematic?0.14:0.05;  // the camera opens out as the rings do
  const edges=cy.edges();
  const waveTimers=[];
  const handle={finished:false};
  let raf=0;

  // Keeping the world point that ends up at the centre of the viewport pinned
  // there for every intermediate zoom, so the camera opens about the dot rather
  // than about the canvas origin.
  const wx=(w/2-pTo.x)/zTo,wy=(h/2-pTo.y)/zTo;
  const camAt=z=>({zoom:z,pan:{x:w/2-z*wx,y:h/2-z*wy}});
  const ease=x=>1-Math.pow(1-x,3);

  /* The camera move goes inside the same batch as the positions. On its own it
     is a second notification in the same frame, and cytoscape answers each one
     with its own render pass, which halved the frame rate for a move the eye can
     barely follow. */
  const place=p=>{
    cy.batch(()=>{
      for(let i=0;i<seeds.length;i++){
        const s=seeds[i];
        const e=ease(Math.min(1,Math.max(0,(p-lag*(s.r/rMax))/(1-lag))));
        const r=s.r*e,a=s.a+swirl*(1-e);
        s.n.position({x:ox+r*Math.cos(a),y:oy+r*Math.sin(a)});
      }
      cy.viewport(camAt(zTo*(1+lift*(1-ease(p)))));
    });
  };
  const land=()=>{
    cy.batch(()=>{for(let i=0;i<seeds.length;i++) seeds[i].n.position({x:seeds[i].x,y:seeds[i].y});});
    cy.viewport({zoom:zTo,pan:pTo});
  };
  const revealEdges=staged=>{
    const all=edges.toArray();
    const show=slice=>{if(!cy.destroyed()) cy.batch(()=>slice.forEach(e=>e.removeStyle('display')));};
    if(!staged||all.length<24){show(all);return;}
    const size=Math.ceil(all.length/3);
    for(let i=0;i<3;i++){
      const slice=all.slice(i*size,(i+1)*size);
      if(!slice.length) break;
      waveTimers.push(setTimeout(()=>show(slice),i*100));
    }
  };
  const stop=()=>{
    if(raf) cancelAnimationFrame(raf);
    raf=0;
    waveTimers.forEach(clearTimeout);
  };
  /* settle=true means a live viewer took the wheel mid-run: put the graph in its
     finished state at once, since a half-spiralled model is not a view anyone
     asked for. settle=false is a teardown, where the nodes this was moving have
     already been replaced. */
  handle.cancel=settle=>{
    if(handle.finished) return;
    handle.finished=true;
    stop();
    if(cy.destroyed()) return;
    if(settle){land();revealEdges(false);}
  };
  const arrive=()=>{
    if(handle.finished) return;
    handle.finished=true;
    stop();
    if(cy.destroyed()) return;
    land();
    revealEdges(true);
  };

  edges.style('display','none');
  place(0);
  if(host){host.classList.remove('cy-flyin');void host.offsetWidth;host.classList.add('cy-flyin');}

  const t0=(window.performance||Date).now();
  const step=()=>{
    raf=0;
    if(handle.finished||cy.destroyed()) return;
    const p=Math.min(1,((window.performance||Date).now()-t0)/dur);
    place(p);
    if(p<1){raf=requestAnimationFrame(step);return;}
    arrive();
  };
  raf=requestAnimationFrame(step);
  return handle;
}

const CIRCLE_LAYOUT={name:'circle',animate:false,fit:true,padding:40,avoidOverlap:true,spacingFactor:1.2};

// ── API helpers ────────────────────────────────────────────
async function apiFetch(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Tree Component ─────────────────────────────────────────
const TreeNode=memo(({domainName,domainData,expandedDomains,expandedTables,
                      onToggleDomain,onToggleTable,onClickDomain,onClickTable,onClickAttr,searchTerm,
                      picked,onTogglePick,onTogglePickMany,
                      designOn,changeCur,onEditDomain,onEditTable,onAddEntity})=>{
  const {color,tables={},subdomains={},division=''}=domainData;
  const isExpanded=expandedDomains.has(domainName);
  const tableEntries=useMemo(()=>Object.entries(tables).sort((a,b)=>a[0].localeCompare(b[0])),[tables]);
  const st=searchTerm.toLowerCase();
  const domainMatches=!st||domainName.toLowerCase().includes(st);
  const matchingTables=useMemo(()=>!st?tableEntries:tableEntries.filter(([tn])=>tn.toLowerCase().includes(st)),[tableEntries,st]);
  if(st&&!domainMatches&&!matchingTables.length) return null;
  const showTables=isExpanded||(st&&matchingTables.length>0);
  const visibleTables=st?matchingTables:tableEntries;
  const visibleCount=visibleTables.length;
  const divHues={'operations':'coral','business':'blue','corporate':'amber'};
  const divAbbr={'operations':'OPS','business':'BIZ','corporate':'COR'};
  const divLower=(division||'').toLowerCase();
  const hasSubs=Object.keys(subdomains).length>0;

  function renderTableRow(tname,tdata,indent){
    const fullId=tdata.full_id||`${domainName}.${tname}`;
    const attrs=tdata.attributes||[];
    const sortedAttrs=[...attrs].sort((a,b)=>a.name.localeCompare(b.name));
    const isTblExp=expandedTables.has(fullId);
    return h('div',{key:fullId,style:{marginLeft:indent,marginBottom:1}},
      h('div',{className:'tree-item',style:{display:'flex',alignItems:'center',padding:'4px 0',cursor:'pointer'}},
        h('input',{type:'checkbox',checked:picked.has(fullId),
          title:picked.has(fullId)?'Remove from selection':'Add to selection',
          'aria-label':'Select '+tname,
          onClick:e=>e.stopPropagation(),
          onChange:()=>onTogglePick(fullId),
          style:{width:13,height:13,margin:'0 5px 0 0',flexShrink:0}}),
        h('button',{
          onClick:e=>{e.stopPropagation();onToggleTable(fullId);},
          style:{width:18,height:18,padding:0,background:'transparent',border:'1px solid var(--line)',
                 borderRadius:3,color:'var(--muted)',cursor:'pointer',fontSize:12,lineHeight:'14px',
                 marginRight:6,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}
        },isTblExp?'−':'+'),
        h('span',{style:{fontSize:10,marginRight:4}},'📊'),
        h('span',{
          style:{fontSize:11,color:'var(--brand)',cursor:'pointer',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},
          onClick:()=>onClickTable(fullId)
        },tname),
        h('span',{style:{fontSize:9,color:'var(--line-strong)',marginLeft:5}},'('+sortedAttrs.length+')'),
        designOn&&changeCur[fullId]&&h('span',{
          className:'chg-dot '+(changeCur[fullId].state==='added'?'add':'mod'),
          style:{marginLeft:5},
          title:changeCur[fullId].state==='added'?'Added in this session':'Changed in this session'}),
        designOn&&h('button',{className:'row-act',style:{marginLeft:4},
          title:'Edit '+tname,
          onClick:e=>{e.stopPropagation();onEditTable(fullId);}},'\u270e')
      ),
      isTblExp&&h('div',{key:'attrs'},[
        ...sortedAttrs.slice(0,TREE_ATTR_CAP).map(attr=>{
        const isPk=attr.pk;
        const isFk=!!attr.fk;
        const icon=isPk?'🔑':isFk?'🔗':'•';
        const iconColor=isPk?'var(--m-gold)':isFk?'var(--danger)':'var(--line-strong)';
        const attrId=`${fullId}.${attr.name}`;
        return h('div',{key:attrId,className:'tree-item',
                        style:{display:'flex',alignItems:'center',padding:'3px 0',marginLeft:indent+24,cursor:'pointer'},
                        onClick:()=>onClickAttr(attrId)},
          h('span',{style:{fontSize:10,color:iconColor,marginRight:6,width:14,flexShrink:0}},icon),
          h('span',{style:{fontSize:10,color:'var(--ink)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},attr.name),
          h('span',{style:{fontSize:9,color:'var(--faint)',marginLeft:5}},attr.type)
        );
      }),
        sortedAttrs.length>TREE_ATTR_CAP&&h('div',{key:'__more',
          style:{fontSize:9,color:'var(--muted)',fontStyle:'italic',marginLeft:indent+24,padding:'3px 0'}},
          `… ${sortedAttrs.length-TREE_ATTR_CAP} more attributes (click the product to view all)`)
      ])
    );
  }

  // Domain-level tick box: ticks or clears every product currently listed under
  // it, and shows the mixed state while only some of them are in the selection.
  const domainIds=visibleTables.map(([tn,td])=>td.full_id||`${domainName}.${tn}`);
  const domainPicked=domainIds.filter(id=>picked.has(id)).length;
  const domainAll=domainIds.length>0&&domainPicked===domainIds.length;

  return h('div',{style:{marginBottom:2}},
    h('div',{className:'tree-item'},
      h('div',{style:{display:'flex',alignItems:'center',padding:'6px 0'}},
        h('input',{type:'checkbox',checked:domainAll,
          ref:el=>{if(el)el.indeterminate=domainPicked>0&&!domainAll;},
          title:domainAll?'Remove every product listed here from the selection'
                         :'Add every product listed here to the selection',
          'aria-label':'Select all of '+domainName,
          onClick:e=>e.stopPropagation(),
          onChange:()=>onTogglePickMany(domainIds,!domainAll),
          style:{width:13,height:13,margin:'0 6px 0 0',flexShrink:0}}),
        h('button',{
          onClick:e=>{e.stopPropagation();onToggleDomain(domainName);},
          style:{width:20,height:20,padding:0,background:'transparent',border:'1px solid var(--line-strong)',
                 borderRadius:3,color:'var(--ink)',cursor:'pointer',fontSize:14,lineHeight:'16px',
                 marginRight:8,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center'}
        },isExpanded?'−':'+'),
        h('div',{style:{width:12,height:12,background:color,borderRadius:3,marginRight:8,flexShrink:0}}),
        h('span',{
          style:{fontSize:12,color:'var(--ink)',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1},
          onClick:()=>onClickDomain(domainName)
        },domainName.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())),
        h('span',{style:{fontSize:10,color:'var(--faint)',marginLeft:5}},'('+visibleCount+')'),
        divHues[divLower]&&h('span',{style:{
          display:'inline-block',padding:'1px 4px',...hueChip(divHues[divLower]),
          borderRadius:3,fontSize:8,fontWeight:'bold',marginLeft:5,flexShrink:0,lineHeight:'12px'
        }},divAbbr[divLower]||divLower.slice(0,3).toUpperCase()),
        designOn&&h('button',{className:'row-act',style:{marginLeft:4},
          title:'Add an entity to '+domainName,
          onClick:e=>{e.stopPropagation();onAddEntity(domainName);}},'+'),
        designOn&&h('button',{className:'row-act',
          title:'Edit the '+domainName+' domain',
          onClick:e=>{e.stopPropagation();onEditDomain(domainName);}},'\u270e')
      )
    ),
    showTables&&h('div',{},
      hasSubs
        ? h('div',{},
            ...Object.keys(subdomains).sort().map(sdname=>{
              const sdTables=visibleTables.filter(([,d])=>(d.subdomain||'')===sdname);
              const ungrouped=visibleTables.filter(([,d])=>!(d.subdomain||''));
              return [
                h('div',{key:sdname,style:{marginLeft:28,marginBottom:1,borderBottom:'1px solid var(--veil)'}},
                  h('div',{style:{display:'flex',alignItems:'center',padding:'5px 0'}},
                    h('span',{style:{fontSize:8,color,marginRight:6}},'◆'),
                    h('span',{className:'subdomain-label',style:{flex:1}},sdname.replace(/_/g,' ').replace(/-/g,' ')),
                    h('span',{style:{fontSize:9,color:'var(--line-strong)',marginLeft:5}},'('+sdTables.length+')')
                  )
                ),
                ...sdTables.map(([tn,td])=>renderTableRow(tn,td,42)),
              ];
            }).flat(),
            ...visibleTables.filter(([,d])=>!(d.subdomain||'')).map(([tn,td])=>renderTableRow(tn,td,28))
          )
        : visibleTables.map(([tn,td])=>renderTableRow(tn,td,28))
    )
  );
});

// ── Node Info Panel ────────────────────────────────────────
function NodeInfoPanel({selectedNode,selectedEdge,treeClick,graphData,domainSizes,setDomainSizes,filterState,
                        picked,onTogglePick,design}){
  const designOn=!!(design&&design.on);
  if(!graphData) return h('div',{style:{padding:'15px'}},
    h('h3',{className:'section-header',style:{borderBottom:'1px solid var(--line)',paddingBottom:10,marginBottom:15}},'📌 Details'),
    h('p',{style:{color:'var(--muted)',fontSize:12,fontStyle:'italic'}},'Click a node to see details'),
    h('div',{style:{marginTop:20}},
      h('p',{style:{color:'var(--brand)',fontSize:11,fontWeight:'bold'}},'💡 Tips:'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:5}},'• Click node to focus'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Click domain to filter'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Double-click for FK view'),
      h('p',{style:{color:'var(--faint)',fontSize:10,marginTop:3}},'• Click edge for details'),
    )
  );

  const {domainHierarchy={},domainColors={},domainStats={}}=graphData;

  // Edge info
  if(selectedEdge&&(!treeClick)){
    const e=selectedEdge;
    const srcDomain=domainColors[e.source_domain]||'var(--muted)';
    const tgtDomain=domainColors[e.target_domain]||'var(--muted)';
    return h('div',{style:{padding:'15px',overflowY:'auto',height:'100%'}},
      h('div',{style:{display:'flex',alignItems:'center',marginBottom:10}},
        h('span',{style:{fontSize:20,marginRight:10}},'🔗'),
        h('div',{},
          h('span',{style:{fontSize:14,fontWeight:'bold',color:'var(--ink)',display:'block'}},'Relationship'),
          h('span',{style:{fontSize:10,color:'var(--muted)'}},`${e.source_table} → ${e.target_table}`)
        )
      ),
      h('div',{className:'domain-box',style:{marginBottom:8}},
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},
          h('div',{style:{width:10,height:10,background:srcDomain,borderRadius:'50%',marginRight:6}}),
          h('span',{style:{color:'var(--brand)',fontSize:11}},'Source: '),
          h('span',{style:{color:'var(--ink)',fontSize:11,marginLeft:4}},e.source_table),
        ),
        h('div',{style:{fontSize:10,color:'var(--muted)',marginLeft:16}},'Column: ',h('span',{style:{color:'var(--m-gold)'}},e.source_column))
      ),
      h('div',{className:'domain-box'},
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:4}},
          h('div',{style:{width:10,height:10,background:tgtDomain,borderRadius:'50%',marginRight:6}}),
          h('span',{style:{color:'var(--g-rose-line)',fontSize:11}},'Target: '),
          h('span',{style:{color:'var(--ink)',fontSize:11,marginLeft:4}},e.target_table),
        ),
        h('div',{style:{fontSize:10,color:'var(--muted)',marginLeft:16}},'Column: ',h('span',{style:{color:'var(--m-gold)'}},e.target_column))
      ),
      designOn&&h('div',{style:{marginTop:12,display:'flex',flexDirection:'column',gap:6}},
        h('button',{className:'btn',style:{justifyContent:'center'},
          title:'Open the entity that carries this key',
          onClick:()=>design.onEditEntity(e.source)},'\u270e Edit '+e.source_table),
        h('button',{className:'btn',style:{justifyContent:'center',color:'var(--danger)'},
          title:'Clear the foreign key — the column itself stays',
          onClick:()=>{
            if(window.confirm('Remove the relationship '+e.source_table+'.'+e.source_column+
              ' \u2192 '+e.target_table+'?\n\nThe column stays on '+e.source_table+
              '; only the reference is cleared.')) design.onDropEdge(e);
          }},'\u2715 Remove relationship')
      )
    );
  }

  // Determine what to show
  let nodeData=null, nodeType=null;
  if(treeClick){
    nodeType=treeClick.type;
    if(nodeType==='table'){
      const [dname,tname]=(treeClick.value||'').split('.');
      const ddata=domainHierarchy[dname]||{};
      nodeData={type:'table',id:treeClick.value,label:tname,domain:dname,
                color:ddata.color||'var(--muted)',
                ...((ddata.tables||{})[tname]||{})};
    } else if(nodeType==='domain'){
      const ddata=domainHierarchy[treeClick.value]||{};
      nodeData={type:'domain',id:`domain_${treeClick.value}`,
                label:(treeClick.value||'').toUpperCase(),
                color:ddata.color||'var(--muted)',...ddata};
    } else if(nodeType==='attribute'){
      const parts=(treeClick.value||'').split('.');
      const dname=parts[0],tname=parts[1],aname=parts.slice(2).join('.');
      const ddata=domainHierarchy[dname]||{};
      const tdata=(ddata.tables||{})[tname]||{};
      const ainfo=(tdata.attributes||[]).find(a=>a.name===aname)||{};
      nodeData={type:'attribute',id:treeClick.value,label:aname,
                domain:dname,table:tname,color:ddata.color||'var(--brand)',...ainfo};
    }
  } else if(selectedNode){
    nodeType=selectedNode.type;
    nodeData=selectedNode;
    if(nodeType==='table'){
      const [dname,tname]=(selectedNode.id||'').split('.');
      const ddata=domainHierarchy[dname]||{};
      const tdata=(ddata.tables||{})[tname]||{};
      nodeData={...selectedNode,...tdata,domain:dname,label:tname,color:selectedNode.color||ddata.color||'var(--muted)'};
    } else if(nodeType==='domain'){
      const dname=(selectedNode.id||'').replace('domain_','');
      const ddata=domainHierarchy[dname]||{};
      nodeData={...selectedNode,...ddata,color:selectedNode.color||ddata.color||'var(--muted)'};
    }
    /* A canvas click carries the colour cytoscape had resolved when it was
       clicked, which is a literal from whichever theme was live then, so the
       panel kept painting the old theme after a swap. Re-deriving it from the
       node's slot hands the resolution back to the DOM, which is what makes the
       tree-click path follow the theme already. */
    if(nodeData&&nodeData.slot) nodeData={...nodeData,color:`var(${nodeData.slot})`};
  }

  if(!nodeData) return h('div',{style:{padding:'15px'}},
    h('h3',{className:'section-header',style:{borderBottom:'1px solid var(--line)',paddingBottom:10,marginBottom:15}},'📌 Details'),
    h('p',{style:{color:'var(--muted)',fontSize:12,fontStyle:'italic'}},'Click a node or edge to see details'),
  );

  // Domain panel
  if(nodeData.type==='domain'){
    const dname=(nodeData.id||'').replace('domain_','')|| nodeData.label||'';
    const dstats=domainStats[dname]||{};
    const subs=nodeData.subdomains||{};
    const viewKey=filterState?`domain:${(filterState.value||'')}`:null;
    const curSizes=(domainSizes||{});
    const curDomSizes=curSizes[viewKey||'main']||{};
    const domId=nodeData.id||`domain_${dname}`;
    const curW=(curDomSizes[domId]||{}).width||DEFAULT_W;
    const curH=(curDomSizes[domId]||{}).height||DEFAULT_H;
    const setSize=(w,h)=>{
      const vk=viewKey||'main';
      setDomainSizes(prev=>{
