# Lokkr (fictional automated parcel-locker company) - domain: locker-network
# Example model for the viewer's Concepts / Processes views.

apiVersion: data-architecture/model/v1
kind: ProcessModel
metadata:
  domain: locker-network
  name: Locker network processes
  version: 1.2.0
  status: agreed

processes:
  - id: outage-handling
    name: Bank outage handling
    definition: From a locker bank failing to it serving parcels again.
    trigger: Monitoring detects that a locker bank stopped responding.
    steps:
      - id: register-outage
        name: Register outage
        actor: network operations
        produces: [bank-outage]
        changes: [locker-bank]
        next: [repair-bank]
      - id: repair-bank
        name: Repair locker bank
        actor: field engineer
        changes: [locker-bank]
        next: [close-outage]
      - id: close-outage
        name: Close outage
        actor: network operations
        changes: [bank-outage, locker-bank]
