# Lokkr (fictional automated parcel-locker company) - domain: parcel-handling
# Example model for the viewer's Concepts / Processes views.

apiVersion: data-architecture/model/v1
kind: BusinessModel
metadata:
  domain: parcel-handling
  name: Parcel Handling
  version: 1.0.0
  status: agreed
  owner:
    team: Parcel Operations
    dataOwner: Head of Parcel Operations
  description: 'The journey of a parcel through the locker: announcement, compartment reservation, drop-off
    by a courier and collection by the recipient (or retrieval by a courier when it expires).'
  changelog: []
dependsOn:
  locker-network:
    version: ^1.2.0
    uses:
    - available-compartment-hours
    - compartment
    - locker-bank
    - locker-site
  customer:
    version: ^2.0.0
    uses:
    - consumer
    - shipper
concepts:
- id: parcel
  kind: entity
  name: Parcel
  definition: A physical item announced by a shipper for delivery to a locker site.
  identifiedBy: Tracking number
  aliases:
    en:
    - shipment
    - item
    - package
  lifecycle:
  - announced
  - in-transit
  - in-locker
  - collected
  - expired
  - returned-to-shipper
  status: agreed
- id: compartment-reservation
  kind: entity
  name: Compartment Reservation
  definition: An allocation of one compartment to one parcel for a time window. A parcel can get a new
    reservation when the first one is cancelled or the compartment turns out too small.
  identifiedBy: Reservation number
  lifecycle:
  - requested
  - confirmed
  - cancelled
  - consumed
  status: agreed
- id: drop-off
  kind: event
  name: Drop-off
  definition: The event of a courier placing a parcel into its reserved compartment and closing the door.
  identifiedBy: Drop-off event id
  occursAt: Moment the courier closes the compartment door
  status: agreed
- id: collection
  kind: event
  name: Collection
  definition: The event of a parcel being taken out of its compartment, either by the recipient or by
    a courier retrieving an expired parcel.
  identifiedBy: Collection event id
  occursAt: Moment the compartment door is closed after removal
  aliases:
    en:
    - pickup
    - retrieval
  classifiedBy:
    collectorType:
    - recipient
    - courier-return
  status: agreed
- id: courier
  kind: entity
  name: Courier
  definition: A person, employed by Lokkr or a subcontractor, authorised to open compartments for drop-off
    and return retrieval.
  identifiedBy: Courier badge number
  aliases:
    en:
    - driver
  status: agreed
relationships:
- id: shipper-sends-parcel
  ends:
  - concept: customer:shipper
    role: sends
    cardinality: 1..1
  - concept: parcel
    role: is sent by
    cardinality: 0..*
- id: parcel-addressed-to-consumer
  ends:
  - concept: parcel
    role: is addressed to
    cardinality: 0..*
  - concept: customer:consumer
    role: is recipient of
    cardinality: 0..1
- id: parcel-destined-for-site
  ends:
  - concept: parcel
    role: is destined for
    cardinality: 0..*
  - concept: locker-network:locker-site
    role: is destination of
    cardinality: 1..1
- id: reservation-made-for-parcel
  ends:
  - concept: compartment-reservation
    role: is made for
    cardinality: 0..*
  - concept: parcel
    role: has
    cardinality: 1..1
- id: reservation-holds-compartment
  ends:
  - concept: compartment-reservation
    role: holds
    cardinality: 0..*
  - concept: locker-network:compartment
    role: is held by
    cardinality: 1..1
- id: drop-off-fulfils-reservation
  ends:
  - concept: drop-off
    role: fulfils
    cardinality: 0..1
  - concept: compartment-reservation
    role: is fulfilled by
    cardinality: 1..1
- id: courier-performs-drop-off
  ends:
  - concept: courier
    role: performs
    cardinality: 1..1
  - concept: drop-off
    role: is performed by
    cardinality: 0..*
- id: collection-releases-parcel
  ends:
  - concept: collection
    role: releases
    cardinality: 0..1
  - concept: parcel
    role: is released by
    cardinality: 1..1
- id: courier-performs-return-collection
  ends:
  - concept: courier
    role: carries out
    cardinality: 0..1
  - concept: collection
    role: is carried out by
    cardinality: 0..*
metrics:
- id: announced-locker-parcels
  name: Announced locker parcels
  definition: Parcels announced in the period with a locker site as destination.
  aggregation: count-distinct
  unit: parcels
  requires:
  - parcel
  - locker-network:locker-site
- id: parcels-placed-in-locker
  name: Parcels placed in locker
  definition: Drop-offs in the period.
  aggregation: count
  unit: parcels
  requires:
  - drop-off
- id: parcels-placed-at-intended-site
  name: Parcels placed at intended site
  definition: Drop-offs where the site of the reserved compartment equals the destination site of the
    parcel.
  aggregation: count
  unit: parcels
  requires:
  - drop-off
  - compartment-reservation
  - parcel
  - locker-network:compartment
  - locker-network:locker-bank
  - locker-network:locker-site
- id: expired-parcels
  name: Expired parcels
  definition: Parcels that reached state expired in the period.
  aggregation: count-distinct
  unit: parcels
  requires:
  - parcel
- id: recipient-collections
  name: Recipient collections
  definition: Collections in the period with collector type recipient.
  aggregation: count
  unit: collections
  requires:
  - collection
- id: dwell-hours
  name: Dwell hours
  definition: For recipient collections, hours between the drop-off and the collection of the same parcel;
    summed.
  aggregation: sum
  unit: hours
  requires:
  - collection
  - parcel
  - compartment-reservation
  - drop-off
- id: occupied-compartment-hours
  name: Occupied compartment hours
  definition: Hours compartments hold a parcel, from drop-off until collection (or until period end if
    not yet collected).
  aggregation: sum
  unit: hours
  requires:
  - drop-off
  - collection
  - compartment-reservation
  - locker-network:compartment
kpis:
- id: intended-site-delivery-rate
  name: Intended-site delivery rate
  definition: Share of announced locker parcels that ended up in a compartment at the site the shipper
    chose.
  formula: parcels-placed-at-intended-site / announced-locker-parcels
  uses:
  - parcels-placed-at-intended-site
  - announced-locker-parcels
  unit: ratio
  direction: higher-is-better
  target: '>= 0.97'
  dimensions:
  - locker-network:locker-site
  - customer:shipper
  timeGrain:
  - day
  - week
  - month
  status: agreed
- id: expiry-rate
  name: Expiry rate
  definition: Share of parcels placed in a locker that were not collected in time.
  formula: expired-parcels / parcels-placed-in-locker
  uses:
  - expired-parcels
  - parcels-placed-in-locker
  unit: ratio
  direction: lower-is-better
  target: <= 0.03
  dimensions:
  - locker-network:locker-site
  - customer:shipper
  timeGrain:
  - week
  - month
  status: agreed
- id: average-dwell-time
  name: Average dwell time
  definition: Average time a parcel waits in the locker before the recipient collects it.
  formula: dwell-hours / recipient-collections
  uses:
  - dwell-hours
  - recipient-collections
  unit: hours
  direction: lower-is-better
  target: <= 24
  dimensions:
  - locker-network:locker-site
  - locker-network:compartment
  - customer:shipper
  timeGrain:
  - day
  - week
  - month
  status: agreed
- id: compartment-occupancy-rate
  name: Compartment occupancy rate
  definition: Share of available compartment hours in which a compartment held a parcel. Too low means
    overcapacity; too high means parcels get rejected.
  formula: occupied-compartment-hours / locker-network:available-compartment-hours
  uses:
  - occupied-compartment-hours
  - locker-network:available-compartment-hours
  unit: ratio
  direction: within-range
  target: 0.60 - 0.85
  dimensions:
  - locker-network:locker-site
  - locker-network:locker-bank
  - locker-network:compartment
  timeGrain:
  - day
  - week
  status: agreed
